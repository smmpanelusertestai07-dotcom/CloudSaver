# PocketIDE build: anything that needs an x86-64 Linux computer, on GitHub's. Programs
# published for x86-64 only, game engines and other heavy builds do not run on a phone's arm64
# processor. Put the commands in the "Build" step (or in a ci/build.sh script, which runs
# when it exists); anything written to out/ comes back into the session's Media.
name: PocketIDE Linux x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketide-linux-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out
          uname -a > out/machine.txt
          if [ -f ci/build.sh ]; then
            bash ci/build.sh 2>&1 | tee out/build.txt
          elif [ -f Makefile ]; then
            make 2>&1 | tee out/build.txt
          else
            echo "Add ci/build.sh (or a Makefile) with the build commands; its output goes to out/." | tee out/build.txt
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pocketide-linux-x64
          path: out/
          if-no-files-found: ignore
          retention-days: 7
