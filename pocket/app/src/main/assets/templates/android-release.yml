# PocketIDE build: an Android release APK, made on GitHub's Linux machine.
#
# It runs `./gradlew assembleRelease` at the top of the repository. When the repository has
# the Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD (add them in PocketIDE: Project, Variables and Secrets, Send to GitHub),
# the APK is signed with that key; otherwise it stays unsigned. The APK and the build reports
# come back into the session's Media. Runs only when you start it.
#
# The signing key never meets the repository's code: the build job has no Secrets, and the
# sign job, on a fresh machine, gets only the built APKs and Google's own signing tools.
name: PocketIDE Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketide-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Collect the APKs
        run: |
          set -euo pipefail
          mkdir -p out
          find . -path '*/build/outputs/apk/release/*.apk' -not -path './out/*' -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pocketide-android-release-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pocketide-android-release-reports
          path: '**/build/reports/'
          if-no-files-found: ignore
          retention-days: 7

  # No checkout and nothing from the build job but its APKs: the Secrets are in this job only.
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the signing Secrets
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "The signing Secrets are not set, so the APK stays unsigned."
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.key.outputs.present == 'true'
        with:
          name: pocketide-android-release-unsigned
          path: unsigned
      - name: Sign the APKs
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # One fixed version of Google's tools, installed here, never whatever else is on the machine.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "build-tools;36.0.0" > /dev/null
          tools="$ANDROID_HOME/build-tools/36.0.0"
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          mkdir -p out
          for apk in unsigned/*.apk; do
            name=$(basename "$apk" .apk)
            name=${name%-unsigned}
            "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "out/$name.apk" "$RUNNER_TEMP/aligned.apk"
          done
          rm -f "$keystore" "$RUNNER_TEMP/aligned.apk"
          ls -l out
      # PocketIDE brings back this signed set in place of the unsigned one.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          name: pocketide-android-release
          path: out/
          if-no-files-found: error
          retention-days: 7
