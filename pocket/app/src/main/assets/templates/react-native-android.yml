# PocketIDE build: a React Native app's Android APK, on GitHub's Linux machine. React Native
# compiles C++ through Google's NDK, which is published for x86-64 computers only. It installs
# the packages from the lock file (`npm ci`), then runs `./gradlew assembleRelease` in android/;
# the APK comes back into the session's Media.
name: PocketIDE React Native Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketide-react-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the release APK
        run: |
          set -euo pipefail
          mkdir -p out
          npm ci 2>&1 | tee out/build.txt
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../out/build.txt
          cp app/build/outputs/apk/release/*.apk ../out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pocketide-react-native-android
          path: out/
          if-no-files-found: ignore
          retention-days: 7
