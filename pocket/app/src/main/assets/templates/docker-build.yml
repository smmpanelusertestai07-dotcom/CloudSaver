# PocketIDE build: the repository's Dockerfile, built on GitHub's Linux machine (the phone's
# computer has no Docker). The build log and the image's layer list come back into the
# session's Media; tick "Keep the image" to also bring the image itself (it can be large,
# and artifacts count against the storage your plan includes). Nothing is pushed to a registry.
name: PocketIDE Docker build

on:
  workflow_dispatch:
    inputs:
      save-image:
        description: Keep the image as a download
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pocketide-docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAVE_IMAGE: ${{ inputs.save-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: |
          set -euo pipefail
          mkdir -p out
          if [ ! -f Dockerfile ]; then echo "No Dockerfile at the top of the repository." >&2; exit 1; fi
          docker build --progress=plain -t pocketide-build:latest . 2>&1 | tee out/build.txt
          docker image inspect pocketide-build:latest > out/image.json
          docker history --no-trunc pocketide-build:latest > out/layers.txt
          if [ "$SAVE_IMAGE" = "true" ]; then docker save pocketide-build:latest | gzip > out/image.tar.gz; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pocketide-docker-build
          path: out/
          if-no-files-found: ignore
          retention-days: 7
