# PocketIDE build: a Mac app or tool, on GitHub's Mac machine. It builds a Swift package
# (`swift build` and `swift test`) or an Xcode project for macOS (scheme from
# `xcodebuild -list`), and sends the build log and the products back into the session's Media.
#
# Cost: a macOS minute counts as ten minutes of a private repository's allowance (a public
# repository is free). The result is unsigned.
name: PocketIDE macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketide-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -f Package.swift ]; then
            swift build -c release 2>&1 | tee out/build.txt
            swift test 2>&1 | tee out/tests.txt
            find .build/release -maxdepth 1 -type f -perm -u+x -exec cp {} out/ \;
          else
            project=$(find . -maxdepth 2 -name '*.xcodeproj' -not -path '*/.*' | head -n 1)
            if [ -z "$project" ]; then echo "No Package.swift or Xcode project found." >&2; exit 1; fi
            scheme=$(xcodebuild -project "$project" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
            xcodebuild -project "$project" -scheme "$scheme" -destination 'platform=macOS' \
              -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee out/build.txt
            find build/Build/Products/Release -maxdepth 1 -name '*.app' -exec ditto -c -k --keepParent {} out/app.zip \;
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pocketide-macos
          path: out/
          if-no-files-found: ignore
          retention-days: 7
