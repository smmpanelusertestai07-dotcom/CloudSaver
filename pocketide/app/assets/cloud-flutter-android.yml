# PocketIDE cloud build: a Flutter Android APK, built on GitHub's x86-64 machines.
#
# Why here and not on the phone: Flutter's Android build needs Google's NDK, which Google
# publishes for x86-64 Linux, Windows and Mac only. GitHub Actions is free for a public
# repository and gives a private one 2,000 minutes a month.
#
# Use: copy this file to .github/workflows/android.yml in the project, commit, push, then
#   gh workflow run android.yml && gh run watch && gh run download -n app-release
# The APK lands in the current folder; install it with: phone install app-release.apk
name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
