# PocketIDE cloud build: an iPhone app, built on GitHub's Mac machines.
#
# Why here and not on the phone: Apple's tools run on Apple hardware only. A macOS runner
# costs ten times an Ubuntu minute of the free allowance; a public repository is free.
# Installing the result on an iPhone needs an Apple developer account ($99 a year) for
# TestFlight, or a free account's seven-day signing.
#
# Use: copy this file to .github/workflows/ios.yml in the project, commit, push, then
#   gh workflow run ios.yml && gh run watch && gh run download -n ios-build
# For Flutter, replace the build step with: flutter build ios --no-codesign
name: ios
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -scheme "$(basename "$PWD")" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v6
        with:
          name: ios-build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app
