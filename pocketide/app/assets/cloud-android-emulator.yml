# PocketIDE cloud test: an Android emulator on GitHub's x86-64 machine, since no phone can
# run one. It installs the APK on a real emulator, opens the app, takes a screenshot and a
# fifteen-second recording, runs the project's instrumented tests if it has any, and hands
# everything back as artifacts. The recipe is the one CloudSaver's own CI runs on eight
# Android versions.
#
# Use: copy this file to .github/workflows/emulator.yml in the project, set PACKAGE below,
# commit, push, then:  gh workflow run emulator.yml && gh run watch && gh run download -n emulator
name: emulator
on:
  workflow_dispatch:
env:
  PACKAGE: com.example.app   # the applicationId of the app under test
  API_LEVEL: '33'            # the Android version to test on: 29 to 36
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
      # The runner has the hardware but not the permission by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the emulator script
        run: |
          mkdir -p out
          cat > out/run.sh <<'EOF'
          set -eu
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          adb install -r "$apk"
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          sleep 8
          adb exec-out screencap -p > out/screen.png
          adb shell screenrecord --time-limit 15 /data/local/tmp/rec.mp4 || true
          adb pull /data/local/tmp/rec.mp4 out/recording.mp4 || true
          adb logcat -d "$PACKAGE":V '*:S' > out/log.txt || true
          if ls app/src/androidTest >/dev/null 2>&1; then ./gradlew connectedDebugAndroidTest --no-daemon || true; fi
          EOF
      - name: Run on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash out/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator
          path: |
            out/
            app/build/reports/androidTests/**
