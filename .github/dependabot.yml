# PocketIDE's workflow pins each action to a commit (plan §13, §16); Dependabot proposes the
# newer releases. CloudSaver's workflow is left out: it keeps its own pins.
# The build templates inside the app follow pocket.yml's pins (TemplateGateTest), and each
# project that adds a template gets its own Dependabot file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - .github/workflows/build.yml
    schedule:
      interval: weekly
    commit-message:
      prefix: pocket
