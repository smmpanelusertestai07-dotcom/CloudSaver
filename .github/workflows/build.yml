name: build

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  # The certificate every installed Ente Saver was first signed with (public).
  # A release must be signed by it, or by a key it handed over to.
  ORIGINAL_CERT_SHA256: ca5d0814e1ab7028ff367f6df56d5428ed8f200b0714e7c28dfeb6f44014c7d5

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      throwaway_key: ${{ steps.keystore.outputs.generated }}
      sign_mode: ${{ steps.keystore.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      # Keystore first: the signing-cert SHA-256 is embedded into the APK
      # (tamper evidence), so it must exist before the build.
      #
      # Three ways to sign, decided here:
      # - rotated: NEW_KEYSTORE_B64 is set. The release is signed with that key
      #   and a key-rotation lineage from the original key, so Android takes it
      #   as an update to every earlier version. The lineage is the committed
      #   .github/signing/ente-saver.lineage when there is one; otherwise the
      #   original key (KEYSTORE_B64) signs it here, in this run.
      # - original: only KEYSTORE_B64 is set - the key every release before
      #   the rotation was signed with.
      # - throwaway: no secrets (a fork). A key that lives for this run only;
      #   the release step refuses to publish with it.
      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NEW_KEYSTORE_B64: ${{ secrets.NEW_KEYSTORE_B64 }}
          NEW_KEYSTORE_PASSWORD: ${{ secrets.NEW_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          cert_of() {
            keytool -exportcert -keystore "$1" -alias "$2" -storepass "$3" -rfc \
              | openssl x509 -noout -fingerprint -sha256 \
              | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f'
          }
          COMMITTED_LINEAGE=.github/signing/ente-saver.lineage
          LINEAGE=""
          LINEAGE_MADE=false
          if [ -n "${NEW_KEYSTORE_B64:-}" ]; then
            echo "$NEW_KEYSTORE_B64" | base64 -d > release-next.p12
            KS_PASS="$NEW_KEYSTORE_PASSWORD"
            KEY_ALIAS=entesaver
            KEY_PASS="$KS_PASS"
            SIGN_KS=release-next.p12
            NEXT_CERT=$(cert_of release-next.p12 "$KEY_ALIAS" "$KS_PASS")
            if [ -f "$COMMITTED_LINEAGE" ]; then
              CHAIN=$("$BT/apksigner" lineage --in "$COMMITTED_LINEAGE" --print-certs \
                | sed -n 's/^Signer #[0-9]* in lineage certificate SHA-256 digest: //p')
              if [ "$(echo "$CHAIN" | head -1)" != "$ORIGINAL_CERT_SHA256" ] \
                 || [ "$(echo "$CHAIN" | tail -1)" != "$NEXT_CERT" ]; then
                echo "::error title=Lineage does not fit the new key::$COMMITTED_LINEAGE must run from the original key ($ORIGINAL_CERT_SHA256) to the key in NEW_KEYSTORE_B64 ($NEXT_CERT)."
                exit 1
              fi
              LINEAGE="$COMMITTED_LINEAGE"
              echo "Signing with the new key and the committed rotation lineage."
            elif [ -n "${KEYSTORE_B64:-}" ]; then
              echo "$KEYSTORE_B64" | base64 -d > release-original.jks
              OLD_ALIAS="${SECRET_KEY_ALIAS:-cloudsaver}"
              export OLD_KS_PASS="$SECRET_KEYSTORE_PASSWORD"
              export OLD_KEY_PASS="${SECRET_KEY_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
              export NEXT_KS_PASS="$KS_PASS"
              OLD_CERT=$(cert_of release-original.jks "$OLD_ALIAS" "$OLD_KS_PASS")
              if [ "$OLD_CERT" != "$ORIGINAL_CERT_SHA256" ]; then
                echo "::error title=KEYSTORE_B64 is not the original key::Its certificate ($OLD_CERT) is not the one every installed Ente Saver was signed with ($ORIGINAL_CERT_SHA256), so it cannot hand over to the new key."
                exit 1
              fi
              "$BT/apksigner" rotate --out rotation.lineage \
                --old-signer --ks release-original.jks --ks-key-alias "$OLD_ALIAS" \
                  --ks-pass env:OLD_KS_PASS --key-pass env:OLD_KEY_PASS \
                --new-signer --ks release-next.p12 --ks-key-alias "$KEY_ALIAS" \
                  --ks-pass env:NEXT_KS_PASS
              rm -f release-original.jks
              LINEAGE=rotation.lineage
              LINEAGE_MADE=true
              echo "Signing with the new key; the original key signed the rotation lineage in this run."
            else
              echo "::error title=New key without a handover::NEW_KEYSTORE_B64 is set, but there is neither a committed $COMMITTED_LINEAGE nor the original key in KEYSTORE_B64 to make one. Android would refuse this build as an update."
              exit 1
            fi
            MODE=rotated
            echo "generated=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            KS_PASS="$SECRET_KEYSTORE_PASSWORD"
            # The alias inside the release key, under the name it was made
            # with; it is part of the key and cannot be renamed.
            KEY_ALIAS="${SECRET_KEY_ALIAS:-cloudsaver}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$KS_PASS}"
            SIGN_KS=release.jks
            MODE=original
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Using keystore from repository secrets."
          else
            KS_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KS_PASS"
            KEY_ALIAS=entesaver
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v -keystore release.jks -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 9125 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Ente Saver Release, OU=Ente Saver, O=Ente Saver"
            SIGN_KS=release.jks
            MODE=throwaway
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found - minted a throwaway key for THIS RUN only."
            echo "It is not written anywhere but this runner, and the release step will refuse to publish with it."
          fi
          {
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
            echo "SIGN_KS=$SIGN_KS"
            echo "SIGN_LINEAGE=$LINEAGE"
            echo "SIGN_MODE=$MODE"
            echo "LINEAGE_MADE=$LINEAGE_MADE"
          } >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          CERT_SHA=$(cert_of "$SIGN_KS" "$KEY_ALIAS" "$KS_PASS")
          echo "CERT_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          echo "Signing mode: $MODE"
          echo "Signing cert SHA-256: $CERT_SHA"

      - name: Lint, unit tests, release build
        run: >
          ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
          -PsigningCertSha256=${{ env.CERT_SHA256 }}

      - name: Sign APK (apksigner - v2+v3, or v3 with the rotation lineage)
        run: |
          set -eu
          VERSION=$(./gradlew -q printVersionName --no-daemon | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          APK_NAME="EnteSaver-v$VERSION-release.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$UNSIGNED" ] || UNSIGNED=app/build/outputs/apk/release/app-release.apk
          # -P 16, not -p: -p is the old 4 KiB rule, and Android 16 runs an
          # app whose .so files are not 16 KiB aligned in a compatibility
          # mode with a launch-time system dialog rather than refusing to
          # install it - so a wrong answer here ships and looks fine in CI.
          # -P <kb> is a flag; <align> stays a positional argument, so the 4
          # is still required. Writing "-P 16 in out" prints the usage text
          # and produces no file - caught by signing a real APK by hand
          # rather than by reading the flag name and assuming.
          "$BT/zipalign" -f -P 16 4 "$UNSIGNED" EnteSaver-aligned.apk
          # The one signing recipe, shared with the emulator's rotation check.
          SIGN_KS_ALIAS="$KEY_ALIAS" bash .github/scripts/sign-apk.sh EnteSaver-aligned.apk "$APK_NAME"
          "$BT/apksigner" verify --print-certs "$APK_NAME"
          # The emulator job installs a fixed name, so keep one alongside it.
          cp "$APK_NAME" EnteSaver-release.apk

      # Every release must install over the Ente Saver already on phones:
      # signed by the original key, or by a key the original handed over to.
      # A new key added without the handover would otherwise ship and be
      # refused on every phone. (A throwaway-key build never publishes; the
      # release job refuses it.)
      - name: The APK can update every installed Ente Saver
        if: steps.keystore.outputs.mode != 'throwaway'
        run: bash .github/scripts/check-signer.sh "$APK_NAME" "$ORIGINAL_CERT_SHA256"

      # A lineage the original key signed in this run. It holds two public
      # certificates and that signature - nothing secret - and committed as
      # .github/signing/ente-saver.lineage it lets later builds sign with the
      # new key alone, should the original key ever leave the secrets.
      - name: Keep the rotation lineage made in this run
        if: env.LINEAGE_MADE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ente-saver-rotation-lineage
          path: rotation.lineage
          if-no-files-found: error

      - name: Alignment gate (16 KiB pages, Android 16)
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # Checked on the SIGNED file, because signing rewrites the archive.
          # Today AGP already emits 16 KiB-aligned entries, so this passes by
          # inheritance; the point of the gate is that a future change which
          # shifts an entry cannot land a shared library on a 4 KiB-but-not-
          # 16 KiB boundary without the build going red.
          "$BT/zipalign" -c -P 16 -v 4 "$APK_NAME" > /dev/null
          # zipalign only checks where each library starts in the archive; a
          # library linked for 4 KiB pages inside it still needs this.
          python3 .github/scripts/check-elf-16k.py "$APK_NAME"
          echo "16 KiB page alignment verified on $APK_NAME"

      - name: Size gate (max 15 MB)
        run: |
          set -eu
          SIZE=$(stat -c%s "$APK_NAME")
          echo "APK size: $SIZE bytes ($(( SIZE / 1048576 )) MiB)"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error::APK exceeds the 15 MB limit"
            exit 1
          fi
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Compute checksums and version
        run: |
          set -eu
          APK_SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          echo "APK_SHA256=$APK_SHA" >> "$GITHUB_ENV"
          echo "Version: $VERSION / APK SHA-256: $APK_SHA"

      - name: Generate release notes
        run: |
          set -eu
          KEYSTORE_NOTE=""
          if [ "${{ steps.keystore.outputs.generated }}" = "true" ]; then
            KEYSTORE_NOTE="This build was signed with a throwaway key that existed only inside its CI run, because no signing secrets are configured. It therefore CANNOT be installed over any other Ente Saver build - Android refuses an update whose signer differs. Generate one key on your own machine and add it as repository secrets; the release step refuses to publish until you do."
          elif [ "$SIGN_MODE" = "rotated" ]; then
            KEYSTORE_NOTE="Signed with the Ente Saver key, which the original key (${ORIGINAL_CERT_SHA256}) handed over to through Android key rotation (APK Signature Scheme v3), so it still installs over every earlier version."
          fi
          cat > RELEASE_NOTES.md <<EOF
          Ente Saver, made for Ente Photos. It installs over every earlier
          version and keeps everything it knew. Only the owner's own device
          findings may ever be patched.

          Offline storage saver. Light copies go to one folder (Pictures/EnteSaver
          for a new install; an older install keeps its old folder until you
          tap Move); Ente Photos backs up only that folder. Photos and videos
          have their own settings. Originals are never touched automatically.
          Everything else is explained inside the app (Help).

          Built to last without maintenance: no server, no account, no analytics,
          no internet permission, nothing that expires, and a database that can
          only be migrated - never rebuilt - so the record of what already
          reached Ente cannot be lost.

          Needs Android 10 or newer. Install: download ${APK_NAME} below and
          open it on your phone.
          Play Protect may warn about a sideloaded APK - choose "More details" ->
          "Install anyway". The app holds no INTERNET permission.

          APK SHA-256: ${APK_SHA256}
          Signing cert SHA-256: ${CERT_SHA256}
          ${KEYSTORE_NOTE}
          EOF
          echo "Release notes generated."

      - name: Job summary
        run: |
          {
            echo "## Ente Saver build ${VERSION}"
            echo ""
            echo "- APK size: ${APK_SIZE} bytes"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Signing cert SHA-256: \`${CERT_SHA256}\`"
            echo "- Signing: ${SIGN_MODE}$([ "$SIGN_MODE" = rotated ] && echo " (lineage from \`${ORIGINAL_CERT_SHA256}\`)")"
            if [ "${{ steps.keystore.outputs.generated }}" = "true" ]; then
              echo ""
              echo "### No signing key is configured, so this build cannot be published"
              echo ""
              echo "This run signed the APK with a key it invented and then threw away, so the"
              echo "APK cannot install over any other Ente Saver build. The release step refuses"
              echo "to publish it. Generate ONE key, on your own machine - never in CI, and never"
              echo "into an artifact - then add it as repository secrets:"
              echo ""
              echo '```'
              echo 'keytool -genkeypair -v -keystore entesaver-release.jks -alias entesaver \\'
              echo '  -keyalg RSA -keysize 4096 -validity 9125 \\'
              echo '  -dname "CN=Ente Saver Release, OU=Ente Saver, O=Ente Saver"'
              echo 'base64 -w0 entesaver-release.jks   # this string is KEYSTORE_B64'
              echo '```'
              echo ""
              echo "Then in Settings -> Secrets and variables -> Actions add:"
              echo "   - \`KEYSTORE_B64\` - the base64 string printed above"
              echo "   - \`KEYSTORE_PASSWORD\` - the store password you chose"
              echo "   - \`KEY_ALIAS\` - entesaver"
              echo "   - \`KEY_PASSWORD\` - the key password you chose"
              echo ""
              echo "Back up the .jks file itself somewhere private. Lose it and no future build"
              echo "can ever update an installed Ente Saver again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish version for later jobs
        id: meta
        run: echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: EnteSaver-release.apk
          path: |
            EnteSaver-*.apk
            RELEASE_NOTES.md
          if-no-files-found: error

  emulator:
    # Every Android this app installs on, from minSdk to targetSdk, not just
    # the one that happens to be current. The behaviour genuinely differs
    # across them: 29 has no media trash and no batch delete request, 30
    # introduces both, 31 adds wallpaper colours, 33 adds the runtime
    # notification permission. A suite that only ever runs on one level says
    # nothing about the phones the other rows describe.
    name: end-to-end on Android ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Android 17 (API 37) runs ahead of the target, to see early what the
    # next version changes; until it is the target it may fail without
    # holding anything up.
    continue-on-error: ${{ matrix.ahead == true }}
    strategy:
      # One level failing must not hide the others: the whole point is to
      # learn which Androids are affected, not just that something is.
      fail-fast: false
      matrix:
        api: [29, 30, 31, 32, 33, 34, 35, 36]
        include:
          # The SDK names Android 17's packages "android-37.0", not "android-37".
          - api: 37
            image: "37.0"
            ahead: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      # A stock runner has ~7.3 GB free, and the AVD wants 7.37 GB for its
      # userdata partition alone - it dies at launch with "Not enough space to
      # create userdata partition". None of these toolchains are used here.
      - name: Free disk space for the emulator
        run: |
          echo "Before:"
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost \
                      /usr/local/share/powershell || true
          docker image prune -af || true
          echo "After:"
          df -h / | tail -1

      # The runner has the hardware but not the permission by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download signed APK
        uses: actions/download-artifact@v7
        with:
          name: EnteSaver-release.apk

      # Google's download of the system image is sometimes cut short ("Error
      # on ZipFile unknown archive"), and the emulator step then fails before
      # a single test runs. Fetch it here, a few tries apart; the next step
      # finds it installed and moves on.
      - name: Install the system image
        run: |
          image="android-${{ matrix.image || matrix.api }}"
          for try in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
                 "system-images;$image;google_apis;x86_64" > /dev/null \
               && [ -d "$ANDROID_HOME/system-images/$image/google_apis/x86_64" ]; then
              exit 0
            fi
            echo "Download $try of the $image image failed; trying again."
            sleep 20
          done
          exit 1

      - name: Run instrumented suite + live install on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The update-over-the-last-release check downloads that release.
          GH_TOKEN: ${{ github.token }}
          THROWAWAY_KEY: ${{ needs.build.outputs.throwaway_key }}
        with:
          api-level: ${{ matrix.image || matrix.api }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # Well under the 7.37 GB default; the suite writes only a few MB.
          # (disk.dataPartition.size takes a suffix - hw.ramSize does not,
          # which is why ram-size must stay unset.)
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # One line: the action runs each script line in its own `sh -c`,
          # so variables and multi-line blocks cannot live here.
          script: bash .github/scripts/emulator-e2e.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-screenshots-api${{ matrix.api }}
          path: |
            artifacts/screenshots
            artifacts/logcat-crash.txt
          if-no-files-found: warn

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-test-report-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

  release:
    name: publish release
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A release nobody can install as an update is not a release.
      #
      # With no signing secrets set, the build step invents a key, signs with
      # it, and throws it away. Android refuses an APK whose signer differs
      # from the installed app, so every such build is a fresh uninstall - and
      # three consecutive releases really did carry three different
      # certificates. Publishing more of them buries the working one deeper,
      # so this refuses instead, and says exactly what to do about it.
      - name: A published release needs a signing key that outlives the run
        if: needs.build.outputs.throwaway_key == 'true'
        run: |
          echo "::error title=No signing key configured::This APK was signed with a key that existed only inside this run, so it cannot install over any other Ente Saver build. Refusing to publish it."
          cat >&2 <<'MSG'

          Generate ONE key on your own machine - never in CI, never into an
          artifact - and add it as repository secrets:

            keytool -genkeypair -v -keystore entesaver-release.jks \
              -alias entesaver -keyalg RSA -keysize 4096 -validity 9125 \
              -dname "CN=Ente Saver Release, OU=Ente Saver, O=Ente Saver"
            base64 -w0 entesaver-release.jks

          Then add them in Settings -> Secrets and variables -> Actions:
            KEYSTORE_B64        the base64 string
            KEYSTORE_PASSWORD   the store password
            KEY_ALIAS           entesaver
            KEY_PASSWORD        the key password

          Keep the .jks file somewhere private and backed up. Lose it and no
          future build can ever update an installed Ente Saver again.
          MSG
          exit 1

      - name: Download signed APK
        uses: actions/download-artifact@v7
        with:
          name: EnteSaver-release.apk

      - name: Publish the GitHub Release, once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          TAG="v${VERSION}"
          # A published tag is one binary, for good.
          #
          # The notes print that APK's SHA-256 and the fingerprint of the
          # certificate it was signed with, and with no signing secret set CI
          # mints a fresh keystore on every run - so re-uploading over a tag
          # that already exists hands a differently-signed file, under a
          # different hash, to everyone who downloaded the first one. Their
          # phone then refuses to install it over what they have, and the
          # hash they were told to check no longer matches the file they got.
          #
          # This is not hypothetical: when another project shared this
          # repository, each of its pushes to main re-ran this job and
          # silently re-signed the last release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already published - leaving it exactly as it is."
            echo "To publish a new build, raise versionName in app/build.gradle.kts."
            exit 0
          fi
          # Tagged at the commit this run built, not at whatever main points
          # to now. Without --target GitHub creates a missing tag from the
          # branch head at the moment of this call, and a push that landed
          # while the emulator legs ran would get the tag and the source
          # archive, while the APK and its hash came from the commit before.
          gh release create "$TAG" "EnteSaver-v${VERSION}-release.apk" \
            --target "$GITHUB_SHA" \
            --title "Ente Saver $TAG" \
            --notes-file RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY"
