name: build

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Keystore first: the signing-cert SHA-256 is embedded into the APK
      # (tamper evidence), so it must exist before the build.
      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            KS_PASS="$SECRET_KEYSTORE_PASSWORD"
            KEY_ALIAS="${SECRET_KEY_ALIAS:-cloudsaver}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$KS_PASS}"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Using keystore from repository secrets."
          else
            KS_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KS_PASS"
            KEY_ALIAS=cloudsaver
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v -keystore release.jks -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 9125 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=CloudSaver Release, OU=CloudSaver, O=CloudSaver"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            base64 -w0 release.jks > release.jks.b64
            echo "$KS_PASS" > keystore-password.txt
            echo "Generated a fresh 25-year keystore (no signing secrets found)."
          fi
          {
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          CERT_SHA=$(keytool -exportcert -keystore release.jks -alias "$KEY_ALIAS" \
              -storepass "$KS_PASS" -rfc \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          echo "CERT_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          echo "Signing cert SHA-256: $CERT_SHA"

      - name: Lint, unit tests, release build
        run: >
          ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
          -PsigningCertSha256=${{ env.CERT_SHA256 }}

      - name: Sign APK (apksigner, v2+v3)
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$UNSIGNED" ] || UNSIGNED=app/build/outputs/apk/release/app-release.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" CloudSaver-aligned.apk
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out CloudSaver-release.apk \
            CloudSaver-aligned.apk
          "$BT/apksigner" verify --print-certs CloudSaver-release.apk

      - name: Size gate (max 15 MB)
        run: |
          set -eu
          SIZE=$(stat -c%s CloudSaver-release.apk)
          echo "APK size: $SIZE bytes ($(( SIZE / 1048576 )) MiB)"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error::APK exceeds the 15 MB limit"
            exit 1
          fi
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Compute checksums and version
        run: |
          set -eu
          APK_SHA=$(sha256sum CloudSaver-release.apk | cut -d' ' -f1)
          echo "APK_SHA256=$APK_SHA" >> "$GITHUB_ENV"
          VERSION=$(./gradlew -q printVersionName --no-daemon | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION / APK SHA-256: $APK_SHA"

      - name: Generate release notes
        run: |
          set -eu
          KEYSTORE_NOTE=""
          if [ "${{ steps.keystore.outputs.generated }}" = "true" ]; then
            KEYSTORE_NOTE="This build was signed with a keystore generated by CI (no signing secrets were configured). Download the cloudsaver-keystore artifact from this workflow run, store it safely, and add it as repository secrets so every future build keeps the same signature."
          fi
          cat > RELEASE_NOTES.md <<EOF
          Offline storage saver. Compressed copies go to Pictures/CloudSaver; your
          cloud app backs up only that folder. Originals are never touched
          automatically. Everything else is explained inside the app (Help).

          Install: download CloudSaver-release.apk below and open it on your phone.
          Play Protect may warn about a sideloaded APK - choose "More details" ->
          "Install anyway". The app holds no INTERNET permission.

          APK SHA-256: ${APK_SHA256}
          Signing cert SHA-256: ${CERT_SHA256}
          ${KEYSTORE_NOTE}
          EOF
          echo "Release notes generated."

      - name: Job summary
        run: |
          {
            echo "## CloudSaver build ${VERSION}"
            echo ""
            echo "- APK size: ${APK_SIZE} bytes"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Signing cert SHA-256: \`${CERT_SHA256}\`"
            if [ "${{ steps.keystore.outputs.generated }}" = "true" ]; then
              echo ""
              echo "### ⚠️ Keystore was GENERATED by this run"
              echo "No signing secrets were configured. Do this now so future builds keep the same signature:"
              echo ""
              echo "1. Download the **cloudsaver-keystore** artifact from this run and store it somewhere safe."
              echo "2. Add these repository secrets (Settings -> Secrets and variables -> Actions):"
              echo "   - \`KEYSTORE_B64\`: contents of release.jks.b64 from the artifact"
              echo "   - \`KEYSTORE_PASSWORD\`: contents of keystore-password.txt from the artifact"
              echo "   - \`KEY_ALIAS\`: cloudsaver"
              echo "   - \`KEY_PASSWORD\`: same as KEYSTORE_PASSWORD"
              echo "3. Never commit the keystore to the repository."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish version for later jobs
        id: meta
        run: echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudSaver-release.apk
          path: |
            CloudSaver-release.apk
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: Upload generated keystore artifact
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloudsaver-keystore
          path: |
            release.jks
            release.jks.b64
            keystore-password.txt
          if-no-files-found: error

  emulator:
    name: end-to-end on emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The runner has the hardware but not the permission by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: CloudSaver-release.apk

      - name: Run instrumented suite + live install on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            mkdir -p artifacts/screenshots
            FAILED=0

            echo "::group::Instrumented end-to-end tests"
            ./gradlew connectedDebugAndroidTest --no-daemon || FAILED=1
            echo "::endgroup::"

            # Always collect the evidence, pass or fail.
            echo "::group::Collect screenshots and logs"
            adb pull /sdcard/Android/data/app.cloudsaver/files/screenshots artifacts/ || true
            ls -la artifacts/screenshots || true
            adb logcat -d > artifacts/logcat.txt || true
            adb logcat -d -b crash > artifacts/logcat-crash.txt || true
            echo "::endgroup::"

            if [ "$FAILED" -ne 0 ]; then
              echo "::error::Instrumented tests failed"
              tail -80 artifacts/logcat-crash.txt || true
              exit 1
            fi

            echo "::group::Install the signed release APK and launch it"
            adb uninstall app.cloudsaver || true
            adb install -r CloudSaver-release.apk
            adb shell am start -n app.cloudsaver/.MainActivity
            sleep 12
            # A crash would leave no process behind.
            if ! adb shell pidof app.cloudsaver > /dev/null; then
              echo "::error::The released APK is not running after launch"
              adb logcat -d -b crash | tail -80
              exit 1
            fi
            adb exec-out screencap -p > artifacts/screenshots/40-release-apk-launched.png
            # Fail on any crash logged during this run.
            if adb logcat -d -b crash | grep -q "app.cloudsaver"; then
              echo "::error::Crash reported for app.cloudsaver"
              adb logcat -d -b crash | tail -120
              exit 1
            fi
            echo "::endgroup::"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: |
            artifacts/screenshots
            artifacts/logcat-crash.txt
          if-no-files-found: warn

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

  release:
    name: publish release
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: CloudSaver-release.apk

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" CloudSaver-release.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" CloudSaver-release.apk \
              --title "CloudSaver $TAG" \
              --notes-file RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"
          fi
