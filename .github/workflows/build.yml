name: build

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Keystore first: the signing-cert SHA-256 is embedded into the APK
      # (tamper evidence), so it must exist before the build.
      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            KS_PASS="$SECRET_KEYSTORE_PASSWORD"
            KEY_ALIAS="${SECRET_KEY_ALIAS:-litesaver}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$KS_PASS}"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Using keystore from repository secrets."
          else
            KS_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KS_PASS"
            KEY_ALIAS=litesaver
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v -keystore release.jks -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 9125 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=LiteSaver Release, OU=LiteSaver, O=LiteSaver"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            base64 -w0 release.jks > release.jks.b64
            echo "$KS_PASS" > keystore-password.txt
            echo "Generated a fresh 25-year keystore (no signing secrets found)."
          fi
          {
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          CERT_SHA=$(keytool -exportcert -keystore release.jks -alias "$KEY_ALIAS" \
              -storepass "$KS_PASS" -rfc \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          echo "CERT_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          echo "Signing cert SHA-256: $CERT_SHA"

      - name: Lint, unit tests, release build
        run: >
          ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
          -PsigningCertSha256=${{ env.CERT_SHA256 }}

      - name: Sign APK (apksigner, v2+v3)
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$UNSIGNED" ] || UNSIGNED=app/build/outputs/apk/release/app-release.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" LiteSaver-aligned.apk
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out LiteSaver-release.apk \
            LiteSaver-aligned.apk
          "$BT/apksigner" verify --print-certs LiteSaver-release.apk

      - name: Size gate (max 15 MB)
        run: |
          set -eu
          SIZE=$(stat -c%s LiteSaver-release.apk)
          echo "APK size: $SIZE bytes ($(( SIZE / 1048576 )) MiB)"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error::APK exceeds the 15 MB limit"
            exit 1
          fi
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Compute checksums and version
        run: |
          set -eu
          APK_SHA=$(sha256sum LiteSaver-release.apk | cut -d' ' -f1)
          echo "APK_SHA256=$APK_SHA" >> "$GITHUB_ENV"
          VERSION=$(./gradlew -q printVersionName --no-daemon | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION / APK SHA-256: $APK_SHA"

      - name: Generate release notes
        run: |
          set -eu
          KEYSTORE_NOTE=""
          if [ "${{ steps.keystore.outputs.generated }}" = "true" ]; then
            KEYSTORE_NOTE="This build was signed with a keystore generated by CI (no signing secrets were configured). Download the litesaver-keystore artifact from this workflow run, store it safely, and add it as repository secrets so every future build keeps the same signature."
          fi
          cat > RELEASE_NOTES.md <<EOF
          # LiteSaver ${VERSION}

          Offline "storage saver" for your gallery. It makes compressed copies in
          Pictures/LiteSaver; your cloud app backs up only that folder. Originals
          are never touched automatically.

          ## Install (sideload)
          1. Download LiteSaver-release.apk below on your phone.
          2. Open it. Allow "install unknown apps" if Android asks.
          3. Play Protect may warn because this APK is sideloaded. Choose "More details" -> "Install anyway". The app is 100% offline - it does not even hold the INTERNET permission.
          4. Open LiteSaver and follow the 6 setup steps.

          ## Integrity
          - APK SHA-256: ${APK_SHA256}
          - Signing cert SHA-256: ${CERT_SHA256}
          - Verify the download: sha256sum LiteSaver-release.apk
          ${KEYSTORE_NOTE}

          ## Threat model (honest)
          - The app holds NO secrets: no accounts, no keys, no server URLs, no INTERNET permission. There is nothing to steal from the APK.
          - Protection = least privilege + tamper evidence + R8 full-mode obfuscation. No Android app can be made undecompilable; we do not claim that (the in-app Privacy page says the same).
          - Tamper evidence: at startup the app compares its signing certificate SHA-256 with the constant embedded at this build (value above). A re-signed copy shows a permanent "Modified copy" banner and disables the Free-up tool and all deletions.
          - Manifest lockdown: only the launcher activity is exported; taskAffinity is empty; no custom permissions, no receivers, no accessibility service, no notification listener, no dynamic code loading, no native libraries beyond AndroidX/Media3.
          - FLAG_SECURE covers the App-lock and Free-up screens.
          - State snapshots (Documents/LiteSaver/state.json and exports) contain only file names, dates, sizes and hashes - never media content or thumbnails.
          - Snapshots are intentionally NOT encrypted with an Android Keystore key: such a key dies on uninstall and would break reinstall recovery. Trade-off accepted and documented here.
          - Logs are app-private and never contain absolute file paths (redacted).

          ## Key decisions
          - Output folder is Pictures/LiteSaver (never DCIM) so clouds with DCIM auto-backup cannot grab originals.
          - Built for E2EE clouds (Ente recommended; MEGA, Filen, Proton Drive). Google Photos and Dropbox are unsupported by design: they cannot back up a single custom folder. The in-app picker explains this.
          - Media3 Transformer with a mandatory result check; retry ladder VBR -> CBR -> software encoder -> copy as-is. An item is never lost.
          - The moov atom stays at the end of MP4 files (platform muxer); irrelevant for backup uploads.
          - NetworkStatsManager.queryDetailsForUid is deprecated but used knowingly: its replacement is still @SystemApi-only.
          - WorkManager is re-enqueued in Application.onCreate; no boot receiver needed.
          - Universal APK: no native code, 16 KB page-size compatible.
          - Daily release cap doubles as the upload network cap; lazy delete keeps copies until proof + space pressure.

          ## Changelog
          ${VERSION}
          - First release: full offline pipeline (scan -> compress -> stage -> daily release into Pictures/LiteSaver).
          - Evidence engine: CONFIRMED (cloud free-up diff) > VERIFIED (per-UID TX data count) > AGED (time).
          - Anchor rule (output folder never empty), self-heal, lazy delete with safety pause.
          - Cloud calculator with measured per-phone compression ratios.
          - SD card storage location with safe pause when the card is missing.
          - App lock (biometric/PIN), FLAG_SECURE, tamper evidence, state snapshots + export/import, Auto Backup.

          ## 15-step real-phone test checklist
          1. Install the APK and finish all 6 onboarding steps (grant the media permission).
          2. The test run shows 3 items with clearly smaller after-sizes.
          3. Tap "Run now" while charging: the silent "Working" notification appears and items move to "Compressed".
          4. Open your gallery: Pictures/LiteSaver contains released copies with the ORIGINAL capture dates.
          5. Check one copy's details: EXIF date/GPS kept, photo displays upright, videos play with sound.
          6. Set your cloud app (Ente recommended) to back up ONLY the LiteSaver folder and let it upload.
          7. Grant Usage access; after the upload, Home's "Uploaded (likely)" count rises on the next maintain pass.
          8. Run the cloud app's own "Free up space", then tap "Confirm uploads" in LiteSaver: a card reports "N files confirmed".
          9. Options -> Output folders -> Separate: new videos land in Pictures/LiteSaver/Videos and get their own batch.
          10. Options -> Video codec -> HEVC: a new video compresses to HEVC (check codec in file details) or falls back safely to as-is copy.
          11. Delete one RELEASED copy by hand (no proof yet): LiteSaver re-creates it on the next pass; the original is untouched.
          12. Set "App max extra" to 1.5 GB and let copies accumulate: old CONFIRMED copies are deleted first, and the newest file of the folder never disappears (anchor rule).
          13. Enable the Free-up tool, free one CONFIRMED original through the system dialog: the item shows "Original freed"; the file is gone from the gallery.
          14. Uninstall + reinstall: restore via Auto Backup or Import (Documents/LiteSaver/state.json). Items without proof show as UNKNOWN and are never reprocessed until you opt in.
          15. With an SD card: Options -> Storage location -> SD card; new releases go to the SD card's Pictures/LiteSaver; eject the card - LiteSaver pauses safely and warns, state intact.
          EOF
          echo "Release notes generated."

      - name: Job summary
        run: |
          {
            echo "## LiteSaver build ${VERSION}"
            echo ""
            echo "- APK size: ${APK_SIZE} bytes"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Signing cert SHA-256: \`${CERT_SHA256}\`"
            if [ "${{ steps.keystore.outputs.generated }}" = "true" ]; then
              echo ""
              echo "### ⚠️ Keystore was GENERATED by this run"
              echo "No signing secrets were configured. Do this now so future builds keep the same signature:"
              echo ""
              echo "1. Download the **litesaver-keystore** artifact from this run and store it somewhere safe."
              echo "2. Add these repository secrets (Settings -> Secrets and variables -> Actions):"
              echo "   - \`KEYSTORE_B64\`: contents of release.jks.b64 from the artifact"
              echo "   - \`KEYSTORE_PASSWORD\`: contents of keystore-password.txt from the artifact"
              echo "   - \`KEY_ALIAS\`: litesaver"
              echo "   - \`KEY_PASSWORD\`: same as KEYSTORE_PASSWORD"
              echo "3. Never commit the keystore to the repository."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteSaver-release.apk
          path: |
            LiteSaver-release.apk
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: Upload generated keystore artifact
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: litesaver-keystore
          path: |
            release.jks
            release.jks.b64
            keystore-password.txt
          if-no-files-found: error

      - name: Create GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" LiteSaver-release.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" LiteSaver-release.apk \
              --title "LiteSaver $TAG" \
              --notes-file RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"
          fi
