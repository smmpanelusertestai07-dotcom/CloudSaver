name: build

on:
  push:
    branches:
      - main
      - "claude/**"
    paths-ignore:
      # The other project that lives in this repository. Nothing under it can
      # change what this workflow builds, so running the eight-emulator matrix
      # for it costs half an hour and proves nothing about CloudSaver.
      - "pocketdesk/**"
      # NovaCalc, the calculator under calculator/, has its own workflow too.
      - "calculator/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      throwaway_key: ${{ steps.keystore.outputs.generated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Keystore first: the signing-cert SHA-256 is embedded into the APK
      # (tamper evidence), so it must exist before the build.
      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            KS_PASS="$SECRET_KEYSTORE_PASSWORD"
            KEY_ALIAS="${SECRET_KEY_ALIAS:-cloudsaver}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$KS_PASS}"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Using keystore from repository secrets."
          else
            KS_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KS_PASS"
            KEY_ALIAS=cloudsaver
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v -keystore release.jks -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 9125 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=CloudSaver Release, OU=CloudSaver, O=CloudSaver"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found - minted a throwaway key for THIS RUN only."
            echo "It is not written anywhere but this runner, and the release step will refuse to publish with it."
          fi
          {
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          CERT_SHA=$(keytool -exportcert -keystore release.jks -alias "$KEY_ALIAS" \
              -storepass "$KS_PASS" -rfc \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          echo "CERT_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          echo "Signing cert SHA-256: $CERT_SHA"

      - name: Lint, unit tests, release build
        run: >
          ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
          -PsigningCertSha256=${{ env.CERT_SHA256 }}

      - name: Sign APK (apksigner, v2+v3)
        run: |
          set -eu
          VERSION=$(./gradlew -q printVersionName --no-daemon | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          APK_NAME="CloudSaver-v$VERSION-release.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$UNSIGNED" ] || UNSIGNED=app/build/outputs/apk/release/app-release.apk
          # -P 16, not -p: -p is the old 4 KiB rule, and Android 16 runs an
          # app whose .so files are not 16 KiB aligned in a compatibility
          # mode with a launch-time system dialog rather than refusing to
          # install it - so a wrong answer here ships and looks fine in CI.
          # -P <kb> is a flag; <align> stays a positional argument, so the 4
          # is still required. Writing "-P 16 in out" prints the usage text
          # and produces no file - caught by signing a real APK by hand
          # rather than by reading the flag name and assuming.
          "$BT/zipalign" -f -P 16 4 "$UNSIGNED" CloudSaver-aligned.apk
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_NAME" \
            CloudSaver-aligned.apk
          "$BT/apksigner" verify --print-certs "$APK_NAME"
          # The emulator job installs a fixed name, so keep one alongside it.
          cp "$APK_NAME" CloudSaver-release.apk

      - name: Alignment gate (16 KiB pages, Android 16)
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # Checked on the SIGNED file, because signing rewrites the archive.
          # Today AGP already emits 16 KiB-aligned entries, so this passes by
          # inheritance; the point of the gate is that a future change which
          # shifts an entry cannot land a shared library on a 4 KiB-but-not-
          # 16 KiB boundary without the build going red.
          "$BT/zipalign" -c -P 16 -v 4 "$APK_NAME" > /dev/null
          echo "16 KiB page alignment verified on $APK_NAME"

      - name: Size gate (max 15 MB)
        run: |
          set -eu
          SIZE=$(stat -c%s "$APK_NAME")
          echo "APK size: $SIZE bytes ($(( SIZE / 1048576 )) MiB)"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error::APK exceeds the 15 MB limit"
            exit 1
          fi
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Compute checksums and version
        run: |
          set -eu
          APK_SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          echo "APK_SHA256=$APK_SHA" >> "$GITHUB_ENV"
          echo "Version: $VERSION / APK SHA-256: $APK_SHA"

      - name: Generate release notes
        run: |
          set -eu
          KEYSTORE_NOTE=""
          if [ "${{ steps.keystore.outputs.generated }}" = "true" ]; then
            KEYSTORE_NOTE="This build was signed with a throwaway key that existed only inside its CI run, because no signing secrets are configured. It therefore CANNOT be installed over any other CloudSaver build - Android refuses an update whose signer differs. Generate one key on your own machine and add it as repository secrets; the release step refuses to publish until you do."
          fi
          cat > RELEASE_NOTES.md <<EOF
          This is the final release of CloudSaver. It is designed to run without
          any future update. Only the owner's own device findings may ever be
          patched.

          Offline storage saver. Optimised copies go to Pictures/CloudSaver; your
          cloud app backs up only that folder. Originals are never touched
          automatically. Everything else is explained inside the app (Help).

          Built to last without maintenance: no server, no account, no analytics,
          no internet permission, nothing that expires, and a database that can
          only be migrated - never rebuilt - so the record of what already
          reached your cloud cannot be lost.

          Install: download ${APK_NAME} below and open it on your phone.
          Play Protect may warn about a sideloaded APK - choose "More details" ->
          "Install anyway". The app holds no INTERNET permission.

          APK SHA-256: ${APK_SHA256}
          Signing cert SHA-256: ${CERT_SHA256}
          ${KEYSTORE_NOTE}
          EOF
          # AA6.1: the verification matrix ships with every release.
          if [ -f RELEASE_MATRIX.md ]; then
            echo "" >> RELEASE_NOTES.md
            cat RELEASE_MATRIX.md >> RELEASE_NOTES.md
          fi
          echo "Release notes generated."

      - name: Job summary
        run: |
          {
            echo "## CloudSaver build ${VERSION}"
            echo ""
            echo "- APK size: ${APK_SIZE} bytes"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Signing cert SHA-256: \`${CERT_SHA256}\`"
            if [ "${{ steps.keystore.outputs.generated }}" = "true" ]; then
              echo ""
              echo "### No signing key is configured, so this build cannot be published"
              echo ""
              echo "This run signed the APK with a key it invented and then threw away, so the"
              echo "APK cannot install over any other CloudSaver build. The release step refuses"
              echo "to publish it. Generate ONE key, on your own machine - never in CI, and never"
              echo "into an artifact - then add it as repository secrets:"
              echo ""
              echo '```'
              echo 'keytool -genkeypair -v -keystore cloudsaver-release.jks -alias cloudsaver \\'
              echo '  -keyalg RSA -keysize 4096 -validity 9125 \\'
              echo '  -dname "CN=CloudSaver Release, OU=CloudSaver, O=CloudSaver"'
              echo 'base64 -w0 cloudsaver-release.jks   # this string is KEYSTORE_B64'
              echo '```'
              echo ""
              echo "Then either run \`scripts/set-signing-secrets.sh cloudsaver-release.jks\` (needs the"
              echo "GitHub CLI signed in as the owner - it asks for the password and sets all four),"
              echo "or in Settings -> Secrets and variables -> Actions add by hand:"
              echo "   - \`KEYSTORE_B64\` - the base64 string printed above"
              echo "   - \`KEYSTORE_PASSWORD\` - the store password you chose"
              echo "   - \`KEY_ALIAS\` - cloudsaver"
              echo "   - \`KEY_PASSWORD\` - the key password you chose"
              echo ""
              echo "Back up the .jks file itself somewhere private. Lose it and no future build"
              echo "can ever update an installed CloudSaver again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish version for later jobs
        id: meta
        run: echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudSaver-release.apk
          path: |
            CloudSaver-*.apk
            RELEASE_NOTES.md
          if-no-files-found: error

  emulator:
    # Every Android this app installs on, from minSdk to targetSdk, not just
    # the one that happens to be current. The behaviour genuinely differs
    # across them: 29 has no media trash and no batch delete request, 30
    # introduces both, 31 adds wallpaper colours, 33 adds the runtime
    # notification permission. A suite that only ever runs on one level says
    # nothing about the phones the other rows describe.
    name: end-to-end on Android ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      # One level failing must not hide the others: the whole point is to
      # learn which Androids are affected, not just that something is.
      fail-fast: false
      matrix:
        api: [29, 30, 31, 32, 33, 34, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # A stock runner has ~7.3 GB free, and the AVD wants 7.37 GB for its
      # userdata partition alone - it dies at launch with "Not enough space to
      # create userdata partition". None of these toolchains are used here.
      - name: Free disk space for the emulator
        run: |
          echo "Before:"
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost \
                      /usr/local/share/powershell || true
          docker image prune -af || true
          echo "After:"
          df -h / | tail -1

      # The runner has the hardware but not the permission by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: CloudSaver-release.apk

      - name: Run instrumented suite + live install on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # Well under the 7.37 GB default; the suite writes only a few MB.
          # (disk.dataPartition.size takes a suffix - hw.ramSize does not,
          # which is why ram-size must stay unset.)
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # One line: the action runs each script line in its own `sh -c`,
          # so variables and multi-line blocks cannot live here.
          script: bash .github/scripts/emulator-e2e.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots-api${{ matrix.api }}
          path: |
            artifacts/screenshots
            artifacts/logcat-crash.txt
          if-no-files-found: warn

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

  release:
    name: publish release
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A release nobody can install as an update is not a release.
      #
      # With no signing secrets set, the build step invents a key, signs with
      # it, and throws it away. Android refuses an APK whose signer differs
      # from the installed app, so every such build is a fresh uninstall - and
      # three consecutive releases really did carry three different
      # certificates. Publishing more of them buries the working one deeper,
      # so this refuses instead, and says exactly what to do about it.
      - name: A published release needs a signing key that outlives the run
        if: needs.build.outputs.throwaway_key == 'true'
        run: |
          echo "::error title=No signing key configured::This APK was signed with a key that existed only inside this run, so it cannot install over any other CloudSaver build. Refusing to publish it."
          cat >&2 <<'MSG'

          Generate ONE key on your own machine - never in CI, never into an
          artifact - and add it as repository secrets:

            keytool -genkeypair -v -keystore cloudsaver-release.jks \
              -alias cloudsaver -keyalg RSA -keysize 4096 -validity 9125 \
              -dname "CN=CloudSaver Release, OU=CloudSaver, O=CloudSaver"
            base64 -w0 cloudsaver-release.jks

          One command, with the GitHub CLI signed in as the owner:
            scripts/set-signing-secrets.sh cloudsaver-release.jks

          Or by hand, Settings -> Secrets and variables -> Actions:
            KEYSTORE_B64        the base64 string
            KEYSTORE_PASSWORD   the store password
            KEY_ALIAS           cloudsaver
            KEY_PASSWORD        the key password

          Keep the .jks file somewhere private and backed up. Lose it and no
          future build can ever update an installed CloudSaver again.
          MSG
          exit 1

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: CloudSaver-release.apk

      - name: Publish the GitHub Release, once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          TAG="v${VERSION}"
          # A published tag is one binary, for good.
          #
          # The notes print that APK's SHA-256 and the fingerprint of the
          # certificate it was signed with, and with no signing secret set CI
          # mints a fresh keystore on every run - so re-uploading over a tag
          # that already exists hands a differently-signed file, under a
          # different hash, to everyone who downloaded the first one. Their
          # phone then refuses to install it over what they have, and the
          # hash they were told to check no longer matches the file they got.
          #
          # This is not hypothetical: a second project shares this repository,
          # and each of its pushes to main re-ran this job and silently
          # re-signed the last CloudSaver release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already published - leaving it exactly as it is."
            echo "To publish a new build, raise versionName in app/build.gradle.kts."
            exit 0
          fi
          gh release create "$TAG" "CloudSaver-v${VERSION}-release.apk" \
            --title "CloudSaver $TAG" \
            --notes-file RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY"
