name: pocketlinux

# PocketLinux lives under pocketlinux/ and has its own Gradle-free build. CloudSaver's own
# workflow ignores that folder; this one covers it: the test suites on every push, then the
# release APK as a downloadable artifact.
on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "pocketlinux/**"
      - ".github/workflows/pocketlinux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketlinux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run the seven suites
        run: bash pocketlinux/tests/run-tests.sh

  build:
    name: Release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android platform 35 and build-tools 35.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      # Optional: the same signing key every time. Add POCKETLINUX_KEYSTORE_B64 (a base64 .jks
      # whose key alias is "pocketdesk" -- the name the key was created under, kept so that every
      # build still installs over the one already on the phone), POCKETLINUX_STORE_PASS and
      # POCKETLINUX_KEY_PASS as repository secrets. Without them the build signs with a key
      # generated for this run only, and an APK signed that way cannot install over another.
      - name: Signing key from secrets, when present
        env:
          KEYSTORE_B64: ${{ secrets.POCKETLINUX_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.POCKETLINUX_STORE_PASS }}
          KEY_PASS: ${{ secrets.POCKETLINUX_KEY_PASS }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p pocketlinux/.signing
            echo "$KEYSTORE_B64" | base64 -d > pocketlinux/.signing/ci.jks
            echo "POCKETLINUX_KEYSTORE=$PWD/pocketlinux/.signing/ci.jks" >> "$GITHUB_ENV"
            echo "POCKETLINUX_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
            echo "POCKETLINUX_KEY_PASS=${KEY_PASS:-$STORE_PASS}" >> "$GITHUB_ENV"
            echo "Signing with the repository's keystore."
          else
            echo "No signing secrets: this run signs with a key generated for this run only."
          fi
      - name: Build
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cd pocketlinux && ./build.sh
      - name: Checksum
        run: sha256sum pocketlinux/build/PocketLinux-v*-release.apk
      - uses: actions/upload-artifact@v6
        with:
          name: PocketLinux-apk
          path: pocketlinux/build/PocketLinux-v*-release.apk
          if-no-files-found: error
