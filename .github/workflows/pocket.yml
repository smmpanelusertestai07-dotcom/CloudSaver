name: pocketide

# PocketIDE lives in pocket/, a standalone Gradle build beside CloudSaver in this repository.
# This workflow never touches CloudSaver, and CloudSaver's build.yml is left alone.
#
#   build       gates, lint, unit tests, the release APK (zipaligned for 16 KB pages, signed
#               v2+v3), the merged-manifest permission check, size and alignment gates, SHA256SUMS
#   cloudshell  the Cloud Shell set-up script, run as PocketIDE runs it on an x86-64 Linux runner
#               (Cloud Shell is one too): VS Code and the three agents install, each checked, each
#               agent's VS Code answers on its own port, and starts again with PocketIDE's door
#   connector   PocketIDE's private tunnel with the gcloud the app pins (its socket folder missing,
#               as on a new phone; a changed gcloud is caught), and an early warning when Google's
#               newest gcloud opens its tunnel another way
#   device      on an Android 15 emulator: the instrumented tests and the screen tour
#   opens       the signed release APK (shrunk by R8) opens on Android 11, 12 and 15 emulators,
#               as a new install and over the last 5.x release
#   release     main only, and only with the owner's stable key: tag pocketide-v<version>, once
on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "pocket/**"
      - ".github/workflows/pocket.yml"
  pull_request:
    paths:
      - "pocket/**"
      - ".github/workflows/pocket.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, gate and sign the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable_key: ${{ steps.certificate.outputs.stable_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The open-source cache provider, a thin layer over actions/cache.
          cache-provider: basic

      - name: Android platform 36 and build-tools 36.0.0
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?the runner has no Android SDK}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          # yes stops with SIGPIPE once sdkmanager has read enough, which pipefail would report.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "BUILD_TOOLS=$sdk/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Gate self-tests (each gate against a tree broken on purpose)
        run: python3 -m unittest discover -s pocket/tools/tests -t pocket/tools

      # A failing gate does not stop the build, so the run still leaves an APK to try; the
      # job fails at the end instead, and a failed job is never released.
      - name: Source gates
        id: source_gates
        continue-on-error: true
        run: python3 pocket/tools/gates/run_all.py

      - name: Version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 pocket/tools/gates/version.py --print)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_NAME=PocketIDE-$version-release.apk" >> "$GITHUB_ENV"

      # The certificate's SHA-256, to check the signed APK against. The owner's key store is
      # decoded only long enough to read the certificate, and again only for signing; without it,
      # a key is made for this run alone and the release job refuses to publish what it signs.
      - name: Signing certificate
        id: certificate
        env:
          POCKETIDE_KEYSTORE_B64: ${{ secrets.POCKETIDE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.POCKETIDE_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.POCKETIDE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/pocketide-signing.jks"
          if [ -n "${POCKETIDE_KEYSTORE_B64:-}" ]; then
            : "${STORE_PASS:?POCKETIDE_STORE_PASS is not set}"
            : "${KEY_ALIAS:?POCKETIDE_KEY_ALIAS is not set}"
            printf '%s' "$POCKETIDE_KEYSTORE_B64" | base64 -d > "$keystore"
            stable=true
          else
            STORE_PASS=$(openssl rand -hex 24)
            echo "::add-mask::$STORE_PASS"
            KEY_ALIAS=throwaway
            export STORE_PASS
            keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.p12" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 30 \
              -dname "CN=PocketIDE throwaway key for run $GITHUB_RUN_ID" \
              -storepass:env STORE_PASS -keypass:env STORE_PASS > /dev/null
            umask 077
            printf '%s' "$STORE_PASS" > "$RUNNER_TEMP/throwaway.pass"
            keystore="$RUNNER_TEMP/throwaway.p12"
            stable=false
          fi
          export STORE_PASS
          sha256=$(keytool -exportcert -rfc -keystore "$keystore" -alias "$KEY_ALIAS" -storepass:env STORE_PASS \
            | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          [ "$stable" = true ] && rm -f "$keystore"
          [ "${#sha256}" = 64 ] || { echo "::error::Could not read the signing certificate"; exit 1; }
          echo "CERT_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "stable_key=$stable" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: $sha256 (stable key: $stable)"

      # Plan §15. Both hold a baseline in pocket/tools/quality/ of what the code had when the gate
      # arrived, so a new finding fails; Android Lint below treats every warning as an error.
      - name: Kotlin style (ktlint)
        working-directory: pocket
        run: ./gradlew --no-daemon ktlintCheck

      - name: Code smells (detekt)
        working-directory: pocket
        run: ./gradlew --no-daemon detekt

      - name: Lint, unit tests and the release build
        working-directory: pocket
        run: >-
          ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
          "-PPOCKETIDE_RELEASES_REPO=$GITHUB_REPOSITORY"

      - name: Upload the lint and test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-reports
          path: |
            pocket/app/build/reports/
            pocket/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Align (16 KB pages) and sign (v2 + v3)
        env:
          POCKETIDE_KEYSTORE_B64: ${{ secrets.POCKETIDE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.POCKETIDE_STORE_PASS }}
          KEY_PASS: ${{ secrets.POCKETIDE_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.POCKETIDE_KEY_ALIAS }}
          STABLE_KEY: ${{ steps.certificate.outputs.stable_key }}
        run: |
          set -euo pipefail
          unsigned=pocket/app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$unsigned" ] || { echo "::error::Gradle produced no $unsigned"; exit 1; }
          if [ "$STABLE_KEY" = true ]; then
            keystore="$RUNNER_TEMP/pocketide-signing.jks"
            printf '%s' "$POCKETIDE_KEYSTORE_B64" | base64 -d > "$keystore"
            KEY_PASS="${KEY_PASS:-$STORE_PASS}"
          else
            keystore="$RUNNER_TEMP/throwaway.p12"
            STORE_PASS=$(cat "$RUNNER_TEMP/throwaway.pass")
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS=throwaway
          fi
          export STORE_PASS KEY_PASS
          mkdir -p dist
          # -P 16 is the 16 KB page rule for uncompressed .so entries; the 4 stays, as the
          # positional alignment for everything else.
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS --key-pass env:KEY_PASS \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "dist/$APK_NAME" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore" "$RUNNER_TEMP/throwaway.pass" "$RUNNER_TEMP/aligned.apk"

      - name: Verify the signature
        run: |
          set -euo pipefail
          # For an APK whose minSdk is 28 or more, verify reports only v3 unless asked to check
          # as an older Android would, which is what proves the v2 block is there too.
          report=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 24 "dist/$APK_NAME")
          printf '%s\n' "$report"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$report"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$report"
          signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$report")
          if [ "$signer" != "$CERT_SHA256" ]; then
            echo "::error::The APK is signed by $signer, but the app was built to expect $CERT_SHA256"
            exit 1
          fi

      - name: 16 KB zip alignment gate
        run: |
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "dist/$APK_NAME" > /dev/null
          echo "dist/$APK_NAME is aligned for 16 KB pages."

      - name: Size gate (60 MB)
        run: |
          set -euo pipefail
          size=$(stat -c %s "dist/$APK_NAME")
          limit=$((60 * 1024 * 1024))
          echo "APK_SIZE=$size" >> "$GITHUB_ENV"
          echo "$APK_NAME: $size bytes ($(awk "BEGIN { printf \"%.1f\", $size / 1048576 }") MB)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::The APK is $size bytes, above the 60 MB limit ($limit bytes)"
            exit 1
          fi

      - name: Built gates (merged-manifest permissions, native libraries in the APK)
        id: built_gates
        continue-on-error: true
        run: python3 pocket/tools/gates/run_all.py --built --apk "dist/$APK_NAME"

      - name: Checksums and job summary
        env:
          STABLE_KEY: ${{ steps.certificate.outputs.stable_key }}
          GATES_PASSED: ${{ steps.source_gates.outcome == 'success' && steps.built_gates.outcome == 'success' }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          apk_sha=$(cut -d' ' -f1 dist/SHA256SUMS)
          {
            echo "## PocketIDE $VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`$APK_NAME\` |"
            echo "| Size | $APK_SIZE bytes |"
            echo "| APK SHA-256 | \`$apk_sha\` |"
            echo "| Signing certificate SHA-256 | \`$CERT_SHA256\` |"
            echo "| All gates passed | $GATES_PASSED |"
            if [ "$STABLE_KEY" != true ]; then
              echo
              echo "### Signed with a throwaway key"
              echo "The POCKETIDE_* signing secrets are not set, so this APK was signed with a key made for"
              echo "this run only. It installs on a phone without PocketIDE and never over another build,"
              echo "and the release job will not publish it. Run pocket/tools/make-secrets-file.py on your"
              echo "own computer and add the values it lists under Settings > Secrets and variables > Actions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Every gate must pass
        if: steps.source_gates.outcome == 'failure' || steps.built_gates.outcome == 'failure'
        run: |
          echo "::error::A gate failed (see 'Source gates' and 'Built gates' above). The APK artifact is for testing only."
          exit 1


  cloudshell:
    name: The Cloud Shell set-up, on x86-64 Linux as in Cloud Shell
    # The script runs here exactly as the owner runs it in Cloud Shell, with HOME in a folder of
    # its own; then each agent's VS Code must answer on its port, and a second start must find
    # everything in place.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck pocket/cloudshell/pocketide-cloudshell.sh

      - name: Set up, then each agent answers on its port
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/cloudshell-home"
          mkdir -p "$home"
          HOME="$home" bash pocket/cloudshell/pocketide-cloudshell.sh
          # Each agent's own VS Code: Claude Code on 8080, Codex on 8081, Antigravity on 8082,
          # asked for under another name, as Cloud Shell's Web Preview asks.
          answers() {
            local port=$1 code=000
            for _ in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $port-cs-test.cloudshell.dev" "http://127.0.0.1:$port/" || true)
              case "$code" in 200 | 302) echo "Port $port answers ($code)."; return 0 ;; esac
              sleep 2
            done
            echo "::error::Nothing answered on port $port ($code); the logs follow."
            cat "$home"/.pocketide/vscode/*/code-server.log "$home/.pocketide/bridge.log" || true
            return 1
          }
          for port in 8080 8081 8082; do answers "$port"; done
          for agent in claude-code codex antigravity; do
            echo "$agent: $(ls "$home/.pocketide/vscode/$agent/extensions" | grep -v '^extensions.json$' | tr '\n' ' ')"
            ls "$home/.pocketide/vscode/$agent/extensions" | grep -q '^pocketide.layout-'
          done
          ls "$home/.pocketide/vscode/antigravity/extensions" | grep -qi '^google.google-antigravity-'
          # Each agent's own instructions begin with Cloud Shell's rules.
          for rules in .claude/CLAUDE.md .codex/AGENTS.md .gemini/GEMINI.md; do
            grep -q 'PocketIDE: Cloud Shell rules' "$home/$rules"
          done
          du -sh "$home"
          # Cloud Shell's own start: tidies, finds everything running, installs nothing again.
          HOME="$home" "$home/.local/bin/pocketide" boot
          grep -q 'pocketide boot' "$home/.customize_environment"

      - name: PocketIDE's app gives its door, and each VS Code starts again with it
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/cloudshell-home"
          launcher="$home/.local/bin/pocketide"
          door='http://{{port}}-0123456789abcdef0123456789abcdef.localhost:40123/'
          # Anything that is not an address the app gives is refused.
          if HOME="$home" "$launcher" proxy-uri 'http://example.com/{{port}}/'; then
            echo "::error::proxy-uri took an address PocketIDE never gives"; exit 1
          fi
          HOME="$home" "$launcher" proxy-uri "$door"
          HOME="$home" "$launcher" --quiet
          test "$(cat "$home/.pocketide/proxy-uri")" = "$door"
          test "$(stat -c %a "$home/.pocketide/proxy-uri")" = 600
          for port in 8080 8081 8082; do
            code=000
            for _ in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/healthz" || true)
              [ "$code" = 200 ] && break
              sleep 2
            done
            test "$code" = 200 || { echo "::error::VS Code on $port did not start again ($code)"; exit 1; }
            pid=$(pgrep -f "code-server.*127.0.0.1:$port" | head -n 1)
            tr '\0' '\n' < "/proc/$pid/environ" | grep -qx "VSCODE_PROXY_URI=$door"
            echo "VS Code on $port starts with PocketIDE's door."
          done
          # The same address again changes nothing: no VS Code starts again.
          before=$(pgrep -f 'code-server.*127.0.0.1:8080' | head -n 1)
          HOME="$home" "$launcher" proxy-uri "$door"
          test "$(pgrep -f 'code-server.*127.0.0.1:8080' | head -n 1)" = "$before"

      - name: The sign-in return reaches an agent waiting on localhost
        run: |
          set -euo pipefail
          # A stand-in for an agent's sign-in server: it answers only to localhost, and sends the
          # browser on to its own page, as Codex's and Antigravity's do.
          cat > "$RUNNER_TEMP/agent.py" <<'PY'
          import http.server
          class Agent(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.headers.get("Host") != "localhost:18555":
                      self.send_response(401); self.end_headers(); return
                  if self.path.startswith("/auth/callback?code=abc&state=xyz"):
                      self.send_response(302); self.send_header("Location", "http://localhost:18555/done"); self.end_headers(); return
                  self.send_response(200); self.end_headers(); self.wfile.write(b"signed in " + self.path.encode())
          http.server.HTTPServer(("127.0.0.1", 18555), Agent).serve_forever()
          PY
          python3 "$RUNNER_TEMP/agent.py" &
          sleep 1
          test "$(curl -s http://127.0.0.1:8090/pocketide/health)" = ok
          token=$(printf '%s' '/auth/callback?code=abc&state=xyz' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Host: 8090-cs-test.cloudshell.dev' "http://127.0.0.1:8090/pocketide/callback/18555/$token")
          case "$location" in */pocketide/callback/18555/*) ;; *) echo "::error::The agent's redirect left the bridge: $location"; exit 1 ;; esac
          curl -s "$location" | grep -q '^signed in /done$'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/pocketide/callback/80/Lw)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/pocketide/callback/18556/Lw)" = 502
          echo "The sign-in return reaches the agent, and its redirect stays on the bridge."

  connector:
    name: gcloud's tunnel stays private (the pinned gcloud, and a warning for the newest)
    # gcloud's Python code is the same for every processor, so the x86-64 archive of the version
    # the app pins tells what the phone's arm64 one does.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned gcloud's tunnel listens only on PocketIDE's socket file
        run: |
          set -euo pipefail
          pins=pocket/app/src/main/java/com/pocketide/linux/LinuxPins.kt
          version=$(sed -n 's/.*GCLOUD_VERSION = "\([0-9.]*\)".*/\1/p' "$pins")
          sha=$(grep -A3 'linux-x86_64.tar.gz' "$pins" | sed -n 's/.*sha256 = "\([0-9a-f]\{64\}\)".*/\1/p')
          test -n "$version" && test -n "$sha"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gcloud.tar.gz" \
            "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-$version-linux-x86_64.tar.gz"
          echo "$sha  $RUNNER_TEMP/gcloud.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gcloud.tar.gz" -C "$RUNNER_TEMP"
          tunnel=pocket/app/src/main/assets/linux/lib/private_tunnel.py
          gcloud_py="$RUNNER_TEMP/google-cloud-sdk/lib/gcloud.py"
          # As on a phone that never connected: the socket's folder does not exist yet.
          export POCKETIDE_TUNNEL="$RUNNER_TEMP/never-made/pi/tunnel.sock"
          said=$(python3 -S "$tunnel" --check "$gcloud_py")
          echo "$said"
          test "$said" = "private tunnel: ok"
          test "$(stat -c %a "$RUNNER_TEMP/never-made/pi")" = 700
          test ! -e "$POCKETIDE_TUNNEL"
          # A gcloud whose tunnel opens another way is caught, and said so in the words the app knows.
          changed="$RUNNER_TEMP/changed/lib"
          mkdir -p "$changed/googlecloudsdk/command_lib/cloud_shell"
          touch "$changed/googlecloudsdk/__init__.py" "$changed/googlecloudsdk/command_lib/__init__.py" \
            "$changed/googlecloudsdk/command_lib/cloud_shell/__init__.py"
          printf 'import socket\nclass CloudShellTunnel:\n  def __init__(self, host, jwt): pass\n  def Start(self):\n    self.s = socket.create_server(("localhost", 0))\n  def Stop(self):\n    self.s.close()\n' \
            > "$changed/googlecloudsdk/command_lib/cloud_shell/tunnel.py"
          touch "$changed/gcloud.py"
          if said=$(python3 -S "$tunnel" --check "$changed/gcloud.py"); then echo "::error::A changed tunnel passed: $said"; exit 1; fi
          echo "$said"
          echo "$said" | grep -q 'opens its Cloud Shell tunnel in a new way'
          # gcloud itself runs through PocketIDE's Python, with its own flags.
          sudo install -D -m 0644 "$tunnel" /opt/pocketide/lib/private_tunnel.py
          sudo install -D -m 0755 pocket/app/src/main/assets/linux/bin/gcloud-python /opt/pocketide/bin/gcloud-python
          CLOUDSDK_PYTHON=/opt/pocketide/bin/gcloud-python CLOUDSDK_CORE_DISABLE_PROMPTS=1 \
            "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" --version | grep -q "Google Cloud SDK $version"

      - name: Early warning - Google's newest gcloud
        # Not a gate: the app puts back the gcloud it pins when an update changes the tunnel. A
        # warning here says the next app version should move its pin after checking.
        run: |
          set -uo pipefail
          if ! curl -fsSL --retry 3 -o "$RUNNER_TEMP/newest.tar.gz" \
            https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz; then
            echo "::warning::Could not download Google's newest gcloud."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/newest" && tar -xzf "$RUNNER_TEMP/newest.tar.gz" -C "$RUNNER_TEMP/newest"
          newest=$(cat "$RUNNER_TEMP/newest/google-cloud-sdk/VERSION")
          export POCKETIDE_TUNNEL="$RUNNER_TEMP/newest-pi/tunnel.sock"
          if said=$(python3 -S pocket/app/src/main/assets/linux/lib/private_tunnel.py --check "$RUNNER_TEMP/newest/google-cloud-sdk/lib/gcloud.py"); then
            echo "gcloud $newest: $said"
          else
            echo "::warning::gcloud $newest: $said"
          fi

  device:
    name: On an Android 15 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android 15 emulator
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?the runner has no Android SDK}"
          tools="$sdk/cmdline-tools/latest/bin"
          image="system-images;android-35;google_apis;x86_64"
          (yes || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" platform-tools emulator "$image" > /dev/null
          # The runner sets XDG_CONFIG_HOME, so avdmanager and the emulator would otherwise look for
          # AVDs in different folders and the emulator quits with "no file pocket.ini". Both honour
          # ANDROID_AVD_HOME, so one folder is named for both.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force --name pocket --package "$image" --device pixel_5 > /dev/null
          if [ ! -f "$ANDROID_AVD_HOME/pocket.ini" ]; then
            echo "::error::avdmanager did not create the AVD in $ANDROID_AVD_HOME"
            find "$HOME" -maxdepth 5 -name pocket.ini 2> /dev/null
            exit 1
          fi
          log="$RUNNER_TEMP/emulator.log"
          nohup "$sdk/emulator/emulator" -avd pocket -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 -camera-back none -camera-front none \
            > "$log" 2>&1 &
          pid=$!
          adb="$sdk/platform-tools/adb"
          "$adb" start-server > /dev/null 2>&1
          booted() { [ "$("$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; }
          # Never wait blindly: stop as soon as the emulator quits, and give up after 15 minutes.
          for _ in $(seq 1 180); do
            if ! kill -0 "$pid" 2> /dev/null; then
              echo "::error::The emulator quit while starting; its log follows."
              cat "$log"
              exit 1
            fi
            booted && break
            sleep 5
          done
          if ! booted; then
            echo "::error::The emulator did not finish starting within 15 minutes; its log follows."
            cat "$log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$scale" 0
          done

      - name: Instrumented tests
        timeout-minutes: 30
        working-directory: pocket
        run: ./gradlew --no-daemon connectedDebugAndroidTest

      # Pictures of every main screen, drawn by this emulator. ScreenTour runs only when asked and
      # saves into the app's own files, which a debuggable build lets run-as read back.
      - name: Screen tour
        timeout-minutes: 15
        working-directory: pocket
        run: |
          set -euo pipefail
          ./gradlew --no-daemon installDebug installDebugAndroidTest
          adb="$ANDROID_HOME/platform-tools/adb"
          result=$("$adb" shell am instrument -w -e tour true -e class com.pocketide.ui.ScreenTour \
            com.pocketide.debug.test/androidx.test.runner.AndroidJUnitRunner | tr -d '\r')
          echo "$result" | tail -n 40
          screens="$RUNNER_TEMP/screens"
          mkdir -p "$screens"
          for name in $("$adb" shell run-as com.pocketide.debug ls files/tour 2> /dev/null | tr -d '\r'); do
            case "$name" in
              *.png) "$adb" exec-out run-as com.pocketide.debug cat "files/tour/$name" > "$screens/$name" ;;
            esac
          done
          echo "Screens saved: $(find "$screens" -name '*.png' | wc -l)"
          if ! grep -q '^OK (' <<< "$result"; then
            echo "::error::The screen tour failed; its output is above."
            exit 1
          fi

      - name: Upload the screens
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-screens
          path: ${{ runner.temp }}/screens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the instrumented test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-device-reports
          path: |
            pocket/app/build/reports/androidTests/
            pocket/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  opens:
    name: The release APK opens on Android ${{ matrix.android }} (new, and over the last 5.x)
    # The signed release APK itself, as a phone gets it. R8 shrinks it, which the debug build the
    # device job tests is not, so only this job would see a crash R8 causes. It must open and keep
    # running on a new install (past the welcome screen to the computer's set-up, whose account
    # chooser opens) and over the last published 5.x release, as an owner updates. 6.x carries no
    # native code; the 5.x APK is arm64 only, which these x86-64 images run through ARM translation.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - android: "11"
            api: 30
          - android: "12"
            api: 31
          - android: "15"
            api: 35
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PocketIDE-apk
          path: dist

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android ${{ matrix.android }} emulator
        timeout-minutes: 25
        env:
          API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?the runner has no Android SDK}"
          tools="$sdk/cmdline-tools/latest/bin"
          image="system-images;android-$API;google_apis;x86_64"
          (yes || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install platform-tools emulator "$image" > /dev/null
          # See the device job: one AVD folder for avdmanager and the emulator.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force --name opens --package "$image" --device pixel_5 > /dev/null
          log="$RUNNER_TEMP/emulator.log"
          nohup "$sdk/emulator/emulator" -avd opens -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 -camera-back none -camera-front none \
            > "$log" 2>&1 &
          pid=$!
          adb="$sdk/platform-tools/adb"
          "$adb" start-server > /dev/null 2>&1
          booted() { [ "$("$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; }
          for _ in $(seq 1 180); do
            if ! kill -0 "$pid" 2> /dev/null; then
              echo "::error::The emulator quit while starting; its log follows."
              cat "$log"
              exit 1
            fi
            booted && break
            sleep 5
          done
          if ! booted; then
            echo "::error::The emulator did not finish starting within 15 minutes; its log follows."
            cat "$log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$scale" 0
          done
          echo "ABIs: $("$adb" shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Open it, new and over the last 5.x
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_KEY: ${{ needs.build.outputs.stable_key }}
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          pkg=com.pocketide
          out="$RUNNER_TEMP/opens"
          mkdir -p "$out"
          apk=$(find dist -name 'PocketIDE-*-release.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::The build job produced no release APK"; exit 1; }
          failed=0

          launch() { "$adb" shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1 || true; }

          # Taps the first thing on the screen whose text is $1; false when there is none.
          tap() {
            local bounds
            "$adb" shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || return 1
            bounds=$("$adb" exec-out cat /sdcard/ui.xml | grep -o "text=\"$1\"[^>]*bounds=\"[^\"]*\"" | head -n 1 \
              | sed -E 's/.*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]".*/\1 \2 \3 \4/') || true
            [ -n "$bounds" ] || return 1
            read -r left top right bottom <<< "$bounds"
            "$adb" shell input tap $(((left + right) / 2)) $(((top + bottom) / 2))
          }

          # After [what] was done, the app must still be running with no crash in the log after
          # $2 seconds (30 by default); keeps a picture of the screen and the log either way.
          check() {
            local name=$1
            sleep "${2:-30}"
            "$adb" exec-out screencap -p > "$out/$name.png" || true
            "$adb" logcat -d > "$out/$name-log.txt" || true
            "$adb" logcat -d -b crash > "$out/$name-crash.txt" || true
            if grep -q "Process: $pkg," "$out/$name-crash.txt" || ! "$adb" shell pidof "$pkg" > /dev/null 2>&1; then
              echo "::error::PocketIDE stopped ($name). Its crash:"
              cat "$out/$name-crash.txt"
              grep -E "AndroidRuntime|FATAL|$pkg" "$out/$name-log.txt" | tail -n 80 || true
              failed=1
            else
              echo "PocketIDE opened and kept running ($name)."
            fi
            "$adb" logcat -c || true
            "$adb" logcat -b crash -c || true
          }

          # A new install: the welcome screen, then the computer's set-up, which the app does not
          # open past until Cloud Shell is set up.
          "$adb" install "$apk"
          "$adb" logcat -c || true
          launch
          check new
          for _ in 1 2 3; do
            tap "Get started" && break
            "$adb" shell input swipe 540 1800 540 600 300
          done
          check set-up 10
          # Android's own account chooser (the emulator has no Google account; it offers to add one).
          if tap "Choose account"; then
            check account-chooser 10
            "$adb" shell input keyevent KEYCODE_BACK
          else
            echo "::warning::No Choose account button on the set-up"
          fi
          "$adb" shell am force-stop "$pkg"
          launch
          check set-up-again

          # An update, as an owner of 5.x gets it: that release installed and opened first.
          "$adb" uninstall "$pkg" > /dev/null
          if [ "$STABLE_KEY" = true ]; then
            old_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
              --jq '[.[].tagName | select(startswith("pocketide-v5."))][0]')
            [ -n "$old_tag" ] || { echo "::error::No 5.x release to update from"; exit 1; }
            gh release download "$old_tag" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/old"
            old=$(find "$RUNNER_TEMP/old" -name '*.apk' | head -n 1)
            "$adb" install "$old"
            launch
            sleep 20
            "$adb" install -r "$apk"
            "$adb" logcat -c || true
            launch
            check "over-$old_tag"
            "$adb" shell am force-stop "$pkg"
            launch
            check "over-$old_tag-again"
          else
            echo "::warning::This APK is signed with a throwaway key, so the update over 5.x was not tried."
          fi
          exit "$failed"

      - name: Upload what it showed
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-opens-android-${{ matrix.android }}
          path: ${{ runner.temp }}/opens/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish pocketide-v${{ needs.build.outputs.version }}
    needs: [build, cloudshell, connector, opens, device]
    # Only the owner's own key makes an APK that installs over the one before it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.stable_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PocketIDE-apk
          path: dist

      - name: Publish once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          # The commit message is the release note; an environment variable keeps it out of
          # the shell's own parsing.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="pocketide-v$VERSION"
          apk="dist/PocketIDE-$VERSION-release.apk"
          [ -f "$apk" ] || { echo "::error::$apk was not produced by the build"; exit 1; }
          (cd dist && sha256sum --check SHA256SUMS)

          # A published tag is one binary, for good: re-uploading would hand a different file,
          # under a different hash, to whoever downloaded the first.
          if state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$state" = false ]; then
              echo "::notice::$tag is already published; leaving it exactly as it is. Raise appVersion in pocket/app/build.gradle.kts to publish a new build."
              exit 0
            fi
            # A draft is what a cancelled run leaves behind; it was never published.
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::error::The tag $tag exists without a release. Delete the tag or raise appVersion in pocket/app/build.gradle.kts."
            exit 1
          fi

          # PRoot is GPL-2.0 and talloc LGPL-3.0: their exact source goes out with the APK.
          python3 pocket/tools/proot/gpl_notice.py "$apk" --app-version "$VERSION" \
            --out dist/GPL-SOURCE.txt --sources dist/gpl-source

          notes="$RUNNER_TEMP/notes.txt"
          message="$HEAD_MESSAGE"
          [ -n "$message" ] || message=$(git log -1 --format=%B)
          {
            echo "PocketIDE $VERSION for arm64 Android phones (Android 10 or newer)."
            echo
            echo "Install: download $(basename "$apk") below and open it on the phone. It installs over"
            echo "PocketIDE 2.6.0 and later builds signed with the same key."
            echo
            echo "APK SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
            echo
            echo "The GPL and LGPL source for PRoot and talloc inside the APK: see GPL-SOURCE.txt below."
            echo
            echo "What changed:"
            echo
            printf '%s\n' "$message" | grep -v -E '^(Co-Authored-By|Claude-Session):' || true
          } > "$notes"

          files=("$apk" dist/SHA256SUMS dist/GPL-SOURCE.txt)
          while IFS= read -r -d '' source_archive; do
            files+=("$source_archive")
          done < <(find dist/gpl-source -type f -print0 2> /dev/null)
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "PocketIDE $VERSION" --notes-file "$notes" --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          echo "Published $tag."
