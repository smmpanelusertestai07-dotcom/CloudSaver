name: pocketide

# PocketIDE lives in pocket/, a standalone Gradle build beside CloudSaver in this repository.
# This workflow never touches CloudSaver, and CloudSaver's build.yml is left alone.
#
#   build    gates, lint, unit tests, the release APK (zipaligned for 16 KB pages, signed v2+v3),
#            the merged-manifest permission check, size and alignment gates, SHA256SUMS
#   inputs   the files the app writes for Linux (settings, agents list, companion, pins), from
#            its unit tests, for the engine and pins jobs
#   engine   the computer on a real arm64 runner, as on a phone: Termux's PRoot, the pinned
#            Ubuntu set up by bootstrap.sh and updated, code-server, the three official agents,
#            and each agent's screen and the sign-in terminal as the app shows them (pictures kept)
#   pins     every download the app pins, re-checked against its publisher
#   proot    PRoot from pinned sources for Android: arm64 as a build check, x86-64 for the emulator
#   device   on an Android 15 emulator: the instrumented tests, the screen tour, then the whole app
#            end to end (set-up from the internet, code-server, every agent's screen, a sign-in link)
#   opens    the signed release APK (shrunk by R8) opens on Android 11, 13 and 15 emulators,
#            as a new install and over 4.1.0
#   release  main only, and only with the owner's stable key: tag pocketide-v<version>, once, with
#            the exact source of the PRoot inside the APK
on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "pocket/**"
      - ".github/workflows/pocket.yml"
  pull_request:
    paths:
      - "pocket/**"
      - ".github/workflows/pocket.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, gate and sign the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable_key: ${{ steps.certificate.outputs.stable_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The open-source cache provider, a thin layer over actions/cache.
          cache-provider: basic

      - name: Android platform 36 and build-tools 36.0.0
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?the runner has no Android SDK}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          # yes stops with SIGPIPE once sdkmanager has read enough, which pipefail would report.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "BUILD_TOOLS=$sdk/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Gate self-tests (each gate against a tree broken on purpose)
        run: python3 -m unittest discover -s pocket/tools/tests -t pocket/tools

      # A failing gate does not stop the build, so the run still leaves an APK to try; the
      # job fails at the end instead, and a failed job is never released.
      - name: Source gates
        id: source_gates
        continue-on-error: true
        run: python3 pocket/tools/gates/run_all.py

      - name: Version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 pocket/tools/gates/version.py --print)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_NAME=PocketIDE-$version-release.apk" >> "$GITHUB_ENV"

      # The certificate's SHA-256, to check the signed APK against. The owner's key store is
      # decoded only long enough to read the certificate, and again only for signing; without it,
      # a key is made for this run alone and the release job refuses to publish what it signs.
      - name: Signing certificate
        id: certificate
        env:
          POCKETIDE_KEYSTORE_B64: ${{ secrets.POCKETIDE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.POCKETIDE_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.POCKETIDE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/pocketide-signing.jks"
          if [ -n "${POCKETIDE_KEYSTORE_B64:-}" ]; then
            : "${STORE_PASS:?POCKETIDE_STORE_PASS is not set}"
            : "${KEY_ALIAS:?POCKETIDE_KEY_ALIAS is not set}"
            printf '%s' "$POCKETIDE_KEYSTORE_B64" | base64 -d > "$keystore"
            stable=true
          else
            STORE_PASS=$(openssl rand -hex 24)
            echo "::add-mask::$STORE_PASS"
            KEY_ALIAS=throwaway
            export STORE_PASS
            keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.p12" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 30 \
              -dname "CN=PocketIDE throwaway key for run $GITHUB_RUN_ID" \
              -storepass:env STORE_PASS -keypass:env STORE_PASS > /dev/null
            umask 077
            printf '%s' "$STORE_PASS" > "$RUNNER_TEMP/throwaway.pass"
            keystore="$RUNNER_TEMP/throwaway.p12"
            stable=false
          fi
          export STORE_PASS
          sha256=$(keytool -exportcert -rfc -keystore "$keystore" -alias "$KEY_ALIAS" -storepass:env STORE_PASS \
            | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          [ "$stable" = true ] && rm -f "$keystore"
          [ "${#sha256}" = 64 ] || { echo "::error::Could not read the signing certificate"; exit 1; }
          echo "CERT_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "stable_key=$stable" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: $sha256 (stable key: $stable)"

      # Plan §15. Both hold a baseline in pocket/tools/quality/ of what the code had when the gate
      # arrived, so a new finding fails; Android Lint below treats every warning as an error.
      - name: Kotlin style (ktlint)
        working-directory: pocket
        run: ./gradlew --no-daemon ktlintCheck

      - name: Code smells (detekt)
        working-directory: pocket
        run: ./gradlew --no-daemon detekt

      - name: Lint, unit tests and the release build
        working-directory: pocket
        run: >-
          ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
          "-PPOCKETIDE_RELEASES_REPO=$GITHUB_REPOSITORY"

      - name: Upload the lint and test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-reports
          path: |
            pocket/app/build/reports/
            pocket/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Align (16 KB pages) and sign (v2 + v3)
        env:
          POCKETIDE_KEYSTORE_B64: ${{ secrets.POCKETIDE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.POCKETIDE_STORE_PASS }}
          KEY_PASS: ${{ secrets.POCKETIDE_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.POCKETIDE_KEY_ALIAS }}
          STABLE_KEY: ${{ steps.certificate.outputs.stable_key }}
        run: |
          set -euo pipefail
          unsigned=pocket/app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$unsigned" ] || { echo "::error::Gradle produced no $unsigned"; exit 1; }
          if [ "$STABLE_KEY" = true ]; then
            keystore="$RUNNER_TEMP/pocketide-signing.jks"
            printf '%s' "$POCKETIDE_KEYSTORE_B64" | base64 -d > "$keystore"
            KEY_PASS="${KEY_PASS:-$STORE_PASS}"
          else
            keystore="$RUNNER_TEMP/throwaway.p12"
            STORE_PASS=$(cat "$RUNNER_TEMP/throwaway.pass")
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS=throwaway
          fi
          export STORE_PASS KEY_PASS
          mkdir -p dist
          # -P 16 is the 16 KB page rule for uncompressed .so entries; the 4 stays, as the
          # positional alignment for everything else.
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS --key-pass env:KEY_PASS \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "dist/$APK_NAME" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore" "$RUNNER_TEMP/throwaway.pass" "$RUNNER_TEMP/aligned.apk"

      - name: Verify the signature
        run: |
          set -euo pipefail
          # For an APK whose minSdk is 28 or more, verify reports only v3 unless asked to check
          # as an older Android would, which is what proves the v2 block is there too.
          report=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 24 "dist/$APK_NAME")
          printf '%s\n' "$report"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$report"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$report"
          signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$report")
          if [ "$signer" != "$CERT_SHA256" ]; then
            echo "::error::The APK is signed by $signer, but the app was built to expect $CERT_SHA256"
            exit 1
          fi

      - name: 16 KB zip alignment gate
        run: |
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "dist/$APK_NAME" > /dev/null
          echo "dist/$APK_NAME is aligned for 16 KB pages."

      - name: Size gate (60 MB)
        run: |
          set -euo pipefail
          size=$(stat -c %s "dist/$APK_NAME")
          limit=$((60 * 1024 * 1024))
          echo "APK_SIZE=$size" >> "$GITHUB_ENV"
          echo "$APK_NAME: $size bytes ($(awk "BEGIN { printf \"%.1f\", $size / 1048576 }") MB)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::The APK is $size bytes, above the 60 MB limit ($limit bytes)"
            exit 1
          fi

      - name: Built gates (merged-manifest permissions, native libraries in the APK)
        id: built_gates
        continue-on-error: true
        run: python3 pocket/tools/gates/run_all.py --built --apk "dist/$APK_NAME"

      - name: Checksums and job summary
        env:
          STABLE_KEY: ${{ steps.certificate.outputs.stable_key }}
          GATES_PASSED: ${{ steps.source_gates.outcome == 'success' && steps.built_gates.outcome == 'success' }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          apk_sha=$(cut -d' ' -f1 dist/SHA256SUMS)
          {
            echo "## PocketIDE $VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`$APK_NAME\` |"
            echo "| Size | $APK_SIZE bytes |"
            echo "| APK SHA-256 | \`$apk_sha\` |"
            echo "| Signing certificate SHA-256 | \`$CERT_SHA256\` |"
            echo "| All gates passed | $GATES_PASSED |"
            if [ "$STABLE_KEY" != true ]; then
              echo
              echo "### Signed with a throwaway key"
              echo "The POCKETIDE_* signing secrets are not set, so this APK was signed with a key made for"
              echo "this run only. It installs on a phone without PocketIDE and never over another build,"
              echo "and the release job will not publish it. Run pocket/tools/make-secrets-file.py on your"
              echo "own computer and add the values it lists under Settings > Secrets and variables > Actions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Every gate must pass
        if: steps.source_gates.outcome == 'failure' || steps.built_gates.outcome == 'failure'
        run: |
          echo "::error::A gate failed (see 'Source gates' and 'Built gates' above). The APK artifact is for testing only."
          exit 1

  inputs:
    name: The files the app writes for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      # The very tests the build job runs: they write the settings, the agents list, the
      # companion and the pins exactly as the app does.
      - name: Write them
        working-directory: pocket
        run: >-
          ./gradlew --no-daemon testDebugUnitTest
          --tests 'com.pocketide.ide.IdeFilesTest' --tests 'com.pocketide.linux.LinuxPinsTest'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-engine-inputs
          path: |
            pocket/app/build/ide-files/
            pocket/app/build/engine/
          if-no-files-found: error
          retention-days: 7

  engine:
    name: The computer on arm64 (Ubuntu, code-server, the three agents)
    needs: [inputs]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PocketIDE-engine-inputs
          path: pocket/app/build

      - name: ShellCheck, and talloc and patch to build PRoot with
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck libtalloc-dev gawk patch > /dev/null
          node --version

      - name: Engine test
        env:
          ENGINE_OUT: ${{ runner.temp }}/agent-screens
        run: bash pocket/tools/engine-test.sh

      - name: Upload the agent screens
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-agent-screens
          path: ${{ runner.temp }}/agent-screens/
          if-no-files-found: ignore
          retention-days: 14

  pins:
    name: Pinned downloads still match their publishers
    needs: [inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PocketIDE-engine-inputs
          path: pocket/app/build

      - name: Check every pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 pocket/tools/check-pins.py

  proot:
    name: PRoot from source (arm64 build check, x86-64 for the emulator)
    # The NDK is published for x86-64 Linux hosts only, so this cross-compiles. The APK keeps the
    # arm64 PRoot proven on phones; the arm64 build here is a check, kept as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: NDK, gawk and patch
        run: |
          set -euo pipefail
          # PRoot's makefile needs gawk (strtonum); the runner's awk may be mawk. patch applies
          # the patches sources.json lists.
          if ! command -v gawk > /dev/null || ! command -v patch > /dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q gawk patch
          fi
          ndk=$(python3 -c 'import json; print(json.load(open("pocket/tools/proot/sources.json"))["ndk"])')
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          bash pocket/tools/proot/build-proot.sh "$RUNNER_TEMP/proot-x86_64" x86_64
          bash pocket/tools/proot/build-proot.sh "$RUNNER_TEMP/proot-arm64" arm64-v8a

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-proot-x86_64
          path: ${{ runner.temp }}/proot-x86_64/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-proot-arm64-not-shipped
          path: ${{ runner.temp }}/proot-arm64/
          if-no-files-found: error

  device:
    name: On an Android 15 emulator, end to end
    # The emulator is x86-64, so the app is built with the x86-64 PRoot from the proot job; the
    # rest (Ubuntu, code-server, the agents) is fetched for x86-64 by the app itself, as a phone
    # fetches it for arm64. Android 15: code-server's VS Code needs a recent WebView, which phones
    # get from the Play Store and an emulator only from a recent system image.
    needs: [proot]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PocketIDE-proot-x86_64
          path: ${{ runner.temp }}/proot-x86_64

      # A stock runner has about 14 GB free. The system image, the emulator's data partition and
      # the computer the app sets up inside it need more. Nothing removed here is used by this job.
      - name: Free disk space for the emulator
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL /usr/share/dotnet \
            /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell || true
          df -h / | tail -1

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android 15 emulator
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?the runner has no Android SDK}"
          tools="$sdk/cmdline-tools/latest/bin"
          image="system-images;android-35;google_apis;x86_64"
          (yes || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" platform-tools emulator "$image" > /dev/null
          # The runner sets XDG_CONFIG_HOME, so avdmanager and the emulator would otherwise look for
          # AVDs in different folders and the emulator quits with "no file pocket.ini". Both honour
          # ANDROID_AVD_HOME, so one folder is named for both.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force --name pocket --package "$image" --device pixel_5 > /dev/null
          if [ ! -f "$ANDROID_AVD_HOME/pocket.ini" ]; then
            echo "::error::avdmanager did not create the AVD in $ANDROID_AVD_HOME"
            find "$HOME" -maxdepth 5 -name pocket.ini 2> /dev/null
            exit 1
          fi
          log="$RUNNER_TEMP/emulator.log"
          # 8 GB of data: the computer takes about 3 GB, the downloads more while it is set up.
          nohup "$sdk/emulator/emulator" -avd pocket -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 -partition-size 8192 -camera-back none -camera-front none \
            > "$log" 2>&1 &
          pid=$!
          adb="$sdk/platform-tools/adb"
          "$adb" start-server > /dev/null 2>&1
          booted() { [ "$("$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; }
          # Never wait blindly: stop as soon as the emulator quits, and give up after 15 minutes.
          for _ in $(seq 1 180); do
            if ! kill -0 "$pid" 2> /dev/null; then
              echo "::error::The emulator quit while starting; its log follows."
              cat "$log"
              exit 1
            fi
            booted && break
            sleep 5
          done
          if ! booted; then
            echo "::error::The emulator did not finish starting within 15 minutes; its log follows."
            cat "$log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$scale" 0
          done

      - name: Instrumented tests
        timeout-minutes: 30
        working-directory: pocket
        run: ./gradlew --no-daemon connectedDebugAndroidTest "-Ppocketide.emulatorLibs=$RUNNER_TEMP/proot-x86_64/jniLibs"

      # Pictures of every main screen, drawn by this emulator. ScreenTour runs only when asked and
      # saves into the app's own files, which a debuggable build lets run-as read back.
      - name: Screen tour
        timeout-minutes: 15
        working-directory: pocket
        run: |
          set -euo pipefail
          ./gradlew --no-daemon installDebug installDebugAndroidTest "-Ppocketide.emulatorLibs=$RUNNER_TEMP/proot-x86_64/jniLibs"
          adb="$ANDROID_HOME/platform-tools/adb"
          result=$("$adb" shell am instrument -w -e tour true -e class com.pocketide.ui.ScreenTour \
            com.pocketide.debug.test/androidx.test.runner.AndroidJUnitRunner | tr -d '\r')
          echo "$result" | tail -n 40
          screens="$RUNNER_TEMP/screens"
          mkdir -p "$screens"
          for name in $("$adb" shell run-as com.pocketide.debug ls files/tour 2> /dev/null | tr -d '\r'); do
            case "$name" in
              *.png) "$adb" exec-out run-as com.pocketide.debug cat "files/tour/$name" > "$screens/$name" ;;
            esac
          done
          echo "Screens saved: $(find "$screens" -name '*.png' | wc -l)"
          if ! grep -q '^OK (' <<< "$result"; then
            echo "::error::The screen tour failed; its output is above."
            exit 1
          fi

      # The whole app, as a new owner uses it: Set up downloads Ubuntu, its tools, code-server and
      # the three agents inside the emulator, then each agent's screen shows in the app.
      - name: End to end
        timeout-minutes: 120
        working-directory: pocket
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" logcat -c
          ("$adb" logcat -s PocketIDE-E2E:I > "$RUNNER_TEMP/e2e-logcat.txt" 2>&1 &)
          result=$("$adb" shell am instrument -w -e e2e true -e class com.pocketide.e2e.ComputerE2E \
            com.pocketide.debug.test/androidx.test.runner.AndroidJUnitRunner | tr -d '\r')
          echo "$result" | tail -n 60
          e2e="$RUNNER_TEMP/e2e"
          mkdir -p "$e2e"
          for name in $("$adb" shell run-as com.pocketide.debug ls files/e2e 2> /dev/null | tr -d '\r'); do
            "$adb" exec-out run-as com.pocketide.debug cat "files/e2e/$name" > "$e2e/$name"
          done
          "$adb" exec-out run-as com.pocketide.debug cat files/computer/home/.pocketide/companion.log > "$e2e/companion.log" 2> /dev/null || true
          [ -f "$e2e/steps.txt" ] && cat "$e2e/steps.txt"
          if ! grep -q '^OK (' <<< "$result"; then
            echo "::error::The end-to-end run failed; its output and steps are above."
            exit 1
          fi

      - name: Upload the screens
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-screens
          path: |
            ${{ runner.temp }}/screens/
            ${{ runner.temp }}/e2e/
            ${{ runner.temp }}/e2e-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the instrumented test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-device-reports
          path: |
            pocket/app/build/reports/androidTests/
            pocket/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  opens:
    name: The release APK opens on Android ${{ matrix.android }} (new, and over 4.1.0)
    # The signed release APK itself, as a phone gets it. R8 shrinks it, which the debug build the
    # device job tests is not, so only this job would see a crash R8 causes. It must open and keep
    # running on a new install (and past the welcome screen to Home), and over the last published
    # release, as an owner updates. The emulator is x86-64; Android 11 and newer images run an
    # arm64-only APK through ARM translation.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - android: "11"
            api: 30
          - android: "13"
            api: 33
          - android: "15"
            api: 35
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PocketIDE-apk
          path: dist

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android ${{ matrix.android }} emulator
        timeout-minutes: 25
        env:
          API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?the runner has no Android SDK}"
          tools="$sdk/cmdline-tools/latest/bin"
          image="system-images;android-$API;google_apis;x86_64"
          (yes || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install platform-tools emulator "$image" > /dev/null
          # See the device job: one AVD folder for avdmanager and the emulator.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force --name opens --package "$image" --device pixel_5 > /dev/null
          log="$RUNNER_TEMP/emulator.log"
          nohup "$sdk/emulator/emulator" -avd opens -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 -camera-back none -camera-front none \
            > "$log" 2>&1 &
          pid=$!
          adb="$sdk/platform-tools/adb"
          "$adb" start-server > /dev/null 2>&1
          booted() { [ "$("$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; }
          for _ in $(seq 1 180); do
            if ! kill -0 "$pid" 2> /dev/null; then
              echo "::error::The emulator quit while starting; its log follows."
              cat "$log"
              exit 1
            fi
            booted && break
            sleep 5
          done
          if ! booted; then
            echo "::error::The emulator did not finish starting within 15 minutes; its log follows."
            cat "$log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$scale" 0
          done
          echo "ABIs: $("$adb" shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Open it, new and over 4.1.0
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_KEY: ${{ needs.build.outputs.stable_key }}
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          pkg=com.pocketide
          out="$RUNNER_TEMP/opens"
          mkdir -p "$out"
          apk=$(find dist -name 'PocketIDE-*-release.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::The build job produced no release APK"; exit 1; }
          failed=0

          launch() { "$adb" shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1 || true; }

          # Taps the first thing on the screen whose text is $1; false when there is none.
          tap() {
            local bounds
            "$adb" shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || return 1
            bounds=$("$adb" exec-out cat /sdcard/ui.xml | grep -o "text=\"$1\"[^>]*bounds=\"[^\"]*\"" | head -n 1 \
              | sed -E 's/.*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]".*/\1 \2 \3 \4/') || true
            [ -n "$bounds" ] || return 1
            read -r left top right bottom <<< "$bounds"
            "$adb" shell input tap $(((left + right) / 2)) $(((top + bottom) / 2))
          }

          # After [what] was done, the app must still be running with no crash in the log; keeps
          # a picture of the screen and the log either way.
          check() {
            local name=$1
            sleep 30
            "$adb" exec-out screencap -p > "$out/$name.png" || true
            "$adb" logcat -d > "$out/$name-log.txt" || true
            "$adb" logcat -d -b crash > "$out/$name-crash.txt" || true
            if grep -q "Process: $pkg," "$out/$name-crash.txt" || ! "$adb" shell pidof "$pkg" > /dev/null 2>&1; then
              echo "::error::PocketIDE stopped ($name). Its crash:"
              cat "$out/$name-crash.txt"
              grep -E "AndroidRuntime|FATAL|$pkg" "$out/$name-log.txt" | tail -n 80 || true
              failed=1
            else
              echo "PocketIDE opened and kept running ($name)."
            fi
            "$adb" logcat -c || true
            "$adb" logcat -b crash -c || true
          }

          # A new install: the welcome screen, then Home.
          "$adb" install "$apk"
          "$adb" logcat -c || true
          launch
          check new
          "$adb" shell pm grant "$pkg" android.permission.POST_NOTIFICATIONS 2> /dev/null || true
          for _ in 1 2 3; do
            tap "Get started" && break
            "$adb" shell input swipe 540 1800 540 600 300
          done
          check home
          "$adb" shell am force-stop "$pkg"
          launch
          check home-again

          # An update, as an owner of 4.1.0 gets it: that release installed and opened first.
          "$adb" uninstall "$pkg" > /dev/null
          if [ "$STABLE_KEY" = true ]; then
            gh release download pocketide-v4.1.0 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/old"
            old=$(find "$RUNNER_TEMP/old" -name '*.apk' | head -n 1)
            "$adb" install "$old"
            launch
            sleep 20
            "$adb" install -r "$apk"
            "$adb" logcat -c || true
            launch
            check over-4.1.0
            "$adb" shell am force-stop "$pkg"
            launch
            check over-4.1.0-again
          else
            echo "::warning::This APK is signed with a throwaway key, so the update over 4.1.0 was not tried."
          fi
          exit "$failed"

      - name: Upload what it showed
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketIDE-opens-android-${{ matrix.android }}
          path: ${{ runner.temp }}/opens/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish pocketide-v${{ needs.build.outputs.version }}
    needs: [build, opens, engine, pins, device]
    # Only the owner's own key makes an APK that installs over the one before it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.stable_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PocketIDE-apk
          path: dist

      - name: Publish once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          # The commit message is the release note; an environment variable keeps it out of
          # the shell's own parsing.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="pocketide-v$VERSION"
          apk="dist/PocketIDE-$VERSION-release.apk"
          [ -f "$apk" ] || { echo "::error::$apk was not produced by the build"; exit 1; }
          (cd dist && sha256sum --check SHA256SUMS)

          # A published tag is one binary, for good: re-uploading would hand a different file,
          # under a different hash, to whoever downloaded the first.
          if state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$state" = false ]; then
              echo "::notice::$tag is already published; leaving it exactly as it is. Raise appVersion in pocket/app/build.gradle.kts to publish a new build."
              exit 0
            fi
            # A draft is what a cancelled run leaves behind; it was never published.
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::error::The tag $tag exists without a release. Delete the tag or raise appVersion in pocket/app/build.gradle.kts."
            exit 1
          fi

          # PRoot is GPL-2.0 and talloc LGPL-3.0: their exact source goes out with the APK.
          python3 pocket/tools/proot/gpl_notice.py "$apk" --app-version "$VERSION" \
            --out dist/GPL-SOURCE.txt --sources dist/gpl-source

          notes="$RUNNER_TEMP/notes.txt"
          message="$HEAD_MESSAGE"
          [ -n "$message" ] || message=$(git log -1 --format=%B)
          {
            echo "PocketIDE $VERSION for arm64 Android phones (Android 10 or newer)."
            echo
            echo "Install: download $(basename "$apk") below and open it on the phone. It installs over"
            echo "PocketIDE 2.6.0 and later builds signed with the same key."
            echo
            echo "APK SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
            echo
            echo "The GPL and LGPL source for PRoot and talloc inside the APK: see GPL-SOURCE.txt below."
            echo
            echo "What changed:"
            echo
            printf '%s\n' "$message" | grep -v -E '^(Co-Authored-By|Claude-Session):' || true
          } > "$notes"

          files=("$apk" dist/SHA256SUMS dist/GPL-SOURCE.txt)
          while IFS= read -r -d '' source_archive; do
            files+=("$source_archive")
          done < <(find dist/gpl-source -type f -print0 2> /dev/null)
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "PocketIDE $VERSION" --notes-file "$notes" --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          echo "Published $tag."
