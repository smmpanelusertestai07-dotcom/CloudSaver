name: pocketdoors

# PocketAgent Doors lives under pocketdoors/ and has its own Gradle-free build, separate from
# pocketlinux/. Nothing here touches it.
on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "pocketdoors/**"
      - ".github/workflows/pocketdoors.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketdoors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android platform 35 and build-tools 35.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Through bash rather than ./: an executable bit is one more thing a checkout can
          # lose, and losing it fails the whole job with exit 126.
          cd pocketdoors && bash build.sh
      - name: Run checks
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          bash pocketdoors/tests/run-tests.sh
      - name: Checksum
        run: sha256sum pocketdoors/build/PocketAgent-Doors-v*-release.apk
      - uses: actions/upload-artifact@v6
        with:
          name: PocketAgent-Doors-apk
          path: pocketdoors/build/PocketAgent-Doors-v*-release.apk
          if-no-files-found: error
