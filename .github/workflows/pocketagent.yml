name: pocketagent

# PocketAgent lives under pocketagent/ and has its own Gradle-free build. CloudSaver's own
# workflow ignores that folder; this one builds it, runs the test suites against the compiled
# classes, then exposes the verified APK as a downloadable artifact.
on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "pocketagent/**"
      - ".github/workflows/pocketagent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketagent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android platform 35 and build-tools 35.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
      - name: Pinned JSON-Java test dependency
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/pocketagent-test-deps"
          json_jar="$RUNNER_TEMP/pocketagent-test-deps/json-20250517.jar"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --max-time 60 --retry 3 \
            https://repo.maven.apache.org/maven2/org/json/json/20250517/json-20250517.jar \
            --output "$json_jar"
          printf '%s  %s\n' '3ea61b2a06e31edf1c91134fe9106b0ebb16628be169f3db75bc7a2b06b45796' "$json_jar" | sha256sum --check --strict
          echo "POCKETAGENT_JSON_JAR=$json_jar" >> "$GITHUB_ENV"
      # Optional: the same signing key every time. Add POCKETAGENT_KEYSTORE_B64 (a base64 .jks
      # with key alias "pocketagent"), POCKETAGENT_STORE_PASS and POCKETAGENT_KEY_PASS as repository
      # secrets. POCKETAGENT_KEY_ALIAS can override the alias. Without them the build signs
      # with a key generated for this run only, and an APK
      # signed that way cannot install over one signed with a different key.
      - name: Signing key from secrets, when present
        env:
          KEYSTORE_B64: ${{ secrets.POCKETAGENT_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.POCKETAGENT_STORE_PASS }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_B64:-}" ]; then
            test -n "${STORE_PASS:-}" || { echo "POCKETAGENT_STORE_PASS is required with a signing keystore." >&2; exit 1; }
            umask 077
            mkdir -p pocketagent/.signing
            printf '%s' "$KEYSTORE_B64" | base64 -d > pocketagent/.signing/ci.jks
            echo "POCKETAGENT_KEYSTORE=$PWD/pocketagent/.signing/ci.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository's keystore."
          else
            echo "No signing secrets: this run signs with a key generated for this run only."
          fi
      - name: Build
        env:
          POCKETAGENT_STORE_PASS: ${{ secrets.POCKETAGENT_STORE_PASS }}
          POCKETAGENT_KEY_PASS: ${{ secrets.POCKETAGENT_KEY_PASS }}
          POCKETAGENT_KEY_ALIAS: ${{ secrets.POCKETAGENT_KEY_ALIAS }}
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Through bash rather than ./: the file's executable bit is one more thing that can
          # be lost in a checkout or a patch, and losing it fails the whole job with exit 126.
          cd pocketagent && bash build.sh
      - name: Run regression suites
        run: bash pocketagent/tests/run-tests.sh
      - name: Checksum
        run: sha256sum pocketagent/build/PocketAgent-v*-release.apk
      - uses: actions/upload-artifact@v6
        with:
          name: PocketAgent-apk
          path: pocketagent/build/PocketAgent-v*-release.apk
          if-no-files-found: error
