name: pocketide

# PocketIDE lives under pocketide/ and has its own Gradle-free build, separate from CloudSaver
# under cloudsaver/. Nothing here touches CloudSaver, and its workflow ignores pocketide/.
#
# Two jobs. The build runs on every push and pull request and always produces an APK artifact.
# The release runs only on main, and only when the APK was signed with the repository's own
# stable key (the POCKETIDE_* secrets): an APK signed with a key that existed for one run only
# cannot install over any other build, and publishing it would hand owners a file their phone
# refuses. The release tag carries the app's own prefix, pocketide-v<version>, so it can never
# collide with CloudSaver's v<version> tags in the same repository, and the app looks for that
# same prefix when it asks whether a newer version exists (see AppUpdates.java).
on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "pocketide/**"
      - ".github/workflows/pocketide.yml"
  pull_request:
    paths:
      - "pocketide/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and gate the APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stable_key: ${{ steps.meta.outputs.stable_key }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # Named explicitly because the action's default is "tools platform-tools", and
          # "tools" is the legacy SDK Tools package that Google's repository no longer
          # serves: sdkmanager answers "Failed to find package 'tools'" and the action fails
          # before the checkout is even built. Two runs went red on that on 2026-09-14 with
          # no change to anything here. Exactly what the build needs, nothing legacy.
          # And platform 29, the minSdk, for the gate that compiles against it
          # (tests/min_api.py): every newer API has to be known and guarded.
          packages: "platforms;android-35 platforms;android-29 build-tools;35.0.0"
      - name: Android platforms 35 and 29, build-tools 35.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "platforms;android-29" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Set these as repository secrets to sign with a key that is not in the repository.
          # Absent, build.sh mints a key for this run only, and the release job below refuses
          # to publish the result -- a sideloaded update has to be signed like the one before.
          POCKETIDE_KEYSTORE_B64: ${{ secrets.POCKETIDE_KEYSTORE_B64 }}
          POCKETIDE_STORE_PASS: ${{ secrets.POCKETIDE_STORE_PASS }}
          POCKETIDE_KEY_PASS: ${{ secrets.POCKETIDE_KEY_PASS }}
          POCKETIDE_KEY_ALIAS: ${{ secrets.POCKETIDE_KEY_ALIAS }}
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -n "${POCKETIDE_KEYSTORE_B64:-}" ]; then
            printf '%s' "$POCKETIDE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pocketide.jks"
            export POCKETIDE_KEYSTORE="$RUNNER_TEMP/pocketide.jks"
            echo "STABLE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "STABLE_KEY=false" >> "$GITHUB_ENV"
          fi
          # Through bash rather than ./: an executable bit is one more thing a checkout can
          # lose, and losing it fails the whole job with exit 126 and no useful message.
          cd pocketide && bash build.sh

      - name: Gates
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          bash pocketide/tests/run-tests.sh

      - name: Checksum and version
        id: meta
        run: |
          set -eu
          APK=$(ls pocketide/build/PocketIDE-v*-release.apk)
          sha256sum "$APK"
          VERSION=$(sed -n 's/^VERSION_NAME="\([^"]*\)"/\1/p' pocketide/build.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stable_key=${STABLE_KEY}" >> "$GITHUB_OUTPUT"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          {
            echo "## PocketIDE $VERSION"
            echo ""
            echo "- APK SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Signing certificate: $("$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256' | head -1 | sed 's/^.*SHA-256 digest: //')"
            if [ "$STABLE_KEY" != "true" ]; then
              echo ""
              echo "### Signed with a throwaway key"
              echo "No POCKETIDE_* secrets are set, so this APK was signed with a key that existed only inside this run. It installs on a phone with no PocketIDE on it and will not install over any other build. The release job does not publish it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: PocketIDE-apk
          path: pocketide/build/PocketIDE-v*-release.apk
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    # Only a build signed with the repository's own key is worth publishing: that is what lets
    # each release install over the one before it, and what the app's own update check hands
    # owners a link to.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.stable_key == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: PocketIDE-apk
      - name: Publish pocketide-v${{ needs.build.outputs.version }}, once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          TAG="pocketide-v${VERSION}"
          APK="PocketIDE-v${VERSION}-release.apk"
          [ -f "$APK" ] || { echo "::error::$APK was not produced by the build"; exit 1; }
          # A published tag is one binary, for good. Re-uploading over it would hand a
          # different file, under a different hash, to whoever downloaded the first one.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already published - leaving it exactly as it is."
            echo "To publish a new build, raise VERSION_NAME in pocketide/build.sh and BuildFacts.java."
            exit 0
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "PocketIDE ${VERSION}. A real development environment that runs on your phone."
            echo ""
            echo "Install: download ${APK} below and open it. It installs over any earlier PocketIDE"
            echo "signed with the same key; Linux, the editor and your projects are kept."
            echo ""
            echo "APK SHA-256: ${SHA}"
            echo ""
            echo "What changed: compare this tag with the previous pocketide-v tag in this repository."
          } > notes.txt
          gh release create "$TAG" "$APK" \
            --title "PocketIDE ${VERSION}" \
            --notes-file notes.txt \
            --repo "$GITHUB_REPOSITORY"
